<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black-translucent" (rather than "default") makes the status bar
       transparent when this is running as a home-screen/standalone app on
       iOS, letting .navbar's own background (see nav.css's
       `padding-top: env(safe-area-inset-top)`) show through underneath it --
       "default"/"black" are opaque, fixed OS colors that never reflect the
       page. iOS never reads `theme-color` for a standalone app's status bar
       (only for a regular Safari tab's toolbar, which the two tags below still
       cover), so this is the only way to tint it, at the cost of the status
       bar's icons/text always being light-colored (iOS's choice, not
       adjustable per-color). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Rellm</title>
  <meta name="description"
    content="Rellm is a decentralized, federated, easy-to-deploy social network built in Rust and gRPC, with Flutter and Web frontends.">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <!-- These placeholders are replaced server-side per-request with page-specific
       link-preview data -- see `spa_web_path`'s `spa_web_path` fn in
       `backend/src/web/spa_web_path.rs`, which does the same replacements for
       Tamagui's static export (see `apps/next/pages/_document.tsx`). The
       marker strings must match exactly between the two templates. -->
  <meta property="og:title" content="Rellm Social Link" />
  <meta property="og:description" content="A link from a fediverse community with events, posts, and realtime chat" />
  <meta property="og:image" content="/favicon.png" />
  <link rel="manifest" href="/manifest.json">
  <script>
    // This app is served from either `/` or `/elm` (see
    // `backend/src/web/elm_web.rs`) -- this regex must agree with
    // `Shared.elm`'s `basePathFromPath`, which does the equivalent detection
    // in Elm for routing/link purposes once the app is running.
    var rellmBasePath = /^\/elm(\/|$)/.test(window.location.pathname) ? "/elm" : "";
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/main.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/ui/modal.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/ui/switch.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/ui/flip.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/ui/reordering.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/ui/popover.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/ui/filter_bar.css">');

    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/media.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/profiles.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/posts.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/events.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/users.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/servers.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/messages.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/market.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/nav.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/accounts_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/starred_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/markdown_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/my_media_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/media_generator_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/create_new_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/media_viewer_panel.css">');
    document.write('<link rel="stylesheet" href="' + rellmBasePath + '/style/shared/messaging_panel.css">');

    // Markdown rendering (see `public/markdown.js`) -- vendored rather than
    // CDN-loaded, so the app keeps working offline/behind a firewall.
    document.write('<script src="' + rellmBasePath + '/vendor/marked.js"><\/script>');
    document.write('<script src="' + rellmBasePath + '/vendor/highlight.min.js"><\/script>');
    document.write('<script src="' + rellmBasePath + '/vendor/dompurify.min.js"><\/script>');
    document.write('<script src="' + rellmBasePath + '/markdown.js"><\/script>');

    // Calendar rendering (see `Components.Pages.EventsPage`'s `Calendar`
    // display mode) -- vendored rather than CDN-loaded, same reasoning as
    // marked/highlight.js/dompurify above. This is FullCalendar's own
    // "global" bundle, which injects its own CSS at runtime, so no separate
    // stylesheet is needed here.
    document.write('<script src="' + rellmBasePath + '/vendor/fullcalendar.min.js"><\/script>');

    // Same "auto" resolution `Shared.effectiveDarkMode` does in Elm -- kept in
    // sync with it via the `setTheme` port subscription below, which fires
    // once at startup (`Shared.init`) and again on every change. This has to
    // live in `<head>`, not `<body>` -- `Browser.application` (see `Main.elm`)
    // takes ownership of `<body>`'s contents on init and would wipe out any
    // element written there that Elm doesn't itself know about.
    document.write(
      '<link id="hljs-theme" rel="stylesheet" data-base-href="' + rellmBasePath + '/vendor/" href="' +
      rellmBasePath + '/vendor/' +
      (((localStorage.getItem("rellmThemePreference") || "auto") === "dark" ||
        ((localStorage.getItem("rellmThemePreference") || "auto") === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches))
        ? "highlight-dark.css" : "highlight-light.css") +
      '">'
    );
  </script>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg, #ffffff);
      transition: opacity 0.2s ease;
      opacity: 1;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #splash img.loaded {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="splash">
    <!-- /favicon.png is generated on the fly by the Rust backend (see
         `backend/src/web/server_information.rs`'s `favicon_png`) from
         whichever server's logo is configured -- it doesn't exist as a
         static file, so it never actually loads as an image when this SPA
         is served standalone (e.g. `elm-spa`'s own dev server, outside the
         backend) -- that dev server's own SPA-fallback routing serves
         `index.html` itself (200 OK, `text/html`) for the unmatched
         `/favicon.png` request, which an `onerror` handler wouldn't catch
         (the request "succeeded"; the image just fails to decode). Starting
         transparent and fading in `onload` (rather than fading out
         `onerror`) covers that case as well as a genuine 404. -->
    <img src="/favicon.png" alt="" onload="this.classList.add('loaded');">
  </div>
  <script>
    document.write('<script src="' + rellmBasePath + '/dist/elm.js"><\/script>');
  </script>
  <script>
    var storedState = null;
    try {
      var raw = localStorage.getItem("rellmState");
      storedState = raw ? JSON.parse(raw) : null;
    } catch (e) {
      console.error("Failed to read stored Rellm state", e);
    }

    var storedThemePreference = localStorage.getItem("rellmThemePreference") || "auto";
    var darkMediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    // Short display name for the browser's own local timezone (e.g. "EDT",
    // "GMT+2") -- `elm/time`'s `Time.here` (see `Shared.elm`'s `init`) only
    // gets Elm a raw UTC offset, not a human-readable name, so this fills
    // that gap via `Intl`, the one thing that actually knows it. A plain
    // flag (read once, like `systemPrefersDark`) rather than a port -- it's
    // only ever read at the instant a timestamp renders (`Components.Users.formatDateTime`),
    // so it doesn't need to stay live across a session the way dark-mode
    // preference does.
    var timeZoneAbbreviation = "";
    try {
      var timeZoneParts = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" }).formatToParts(new Date());
      var timeZonePart = timeZoneParts.find(function (part) { return part.type === "timeZoneName"; });
      timeZoneAbbreviation = timeZonePart ? timeZonePart.value : "";
    } catch (e) {
      console.error("Failed to resolve local timezone abbreviation", e);
    }

    // Whether the browser's own locale renders a time of day in 24-hour
    // form (e.g. "18:00") rather than 12-hour ("6:00 PM") -- same
    // read-once-via-Intl-flag convention as `timeZoneAbbreviation` just
    // above (see `Shared.BrowserTimeZone`'s own doc on why this is a flag,
    // not a port). `resolvedOptions().hour12` is `Intl`'s own answer to
    // this for the browser's default locale; defaults to `false` (24-hour)
    // only if the lookup itself throws, same fail-safe direction
    // `timeZoneAbbreviation` takes (an empty/default value, not a crash).
    var uses24HourTime = false;
    try {
      uses24HourTime = new Intl.DateTimeFormat(undefined, { hour: "numeric" }).resolvedOptions().hour12 === false;
    } catch (e) {
      console.error("Failed to resolve whether the locale uses 24-hour time", e);
    }

    var storedStarredPosts = [];
    try {
      var rawStarredPosts = localStorage.getItem("rellmStarredPosts");
      storedStarredPosts = rawStarredPosts ? JSON.parse(rawStarredPosts) : [];
    } catch (e) {
      console.error("Failed to read stored starred posts", e);
    }

    var storedFederatedAuthKeyPair = null;
    try {
      var rawFederatedAuthKeyPair = localStorage.getItem("rellmFederatedAuthKeyPair");
      storedFederatedAuthKeyPair = rawFederatedAuthKeyPair ? JSON.parse(rawFederatedAuthKeyPair) : null;
    } catch (e) {
      console.error("Failed to read stored federated auth keypair", e);
    }

    var storedUserPreferences = null;
    try {
      var rawUserPreferences = localStorage.getItem("rellmUserPreferences");
      storedUserPreferences = rawUserPreferences ? JSON.parse(rawUserPreferences) : null;
    } catch (e) {
      console.error("Failed to read stored user preferences", e);
    }

    var storedBlueskyAccounts = [];
    try {
      var rawBlueskyAccounts = localStorage.getItem("rellmBlueskyAccounts");
      storedBlueskyAccounts = rawBlueskyAccounts ? JSON.parse(rawBlueskyAccounts) : [];
    } catch (e) {
      console.error("Failed to read stored Bluesky accounts", e);
    }

    var storedMastodonAccountsAndServers = null;
    try {
      var rawMastodonAccountsAndServers = localStorage.getItem("rellmMastodonAccountsAndServers");
      storedMastodonAccountsAndServers = rawMastodonAccountsAndServers ? JSON.parse(rawMastodonAccountsAndServers) : null;
    } catch (e) {
      console.error("Failed to read stored Mastodon accounts/servers", e);
    }

    var app = Elm.Main.init({
      flags: {
        state: storedState,
        systemPrefersDark: darkMediaQuery.matches,
        themePreference: storedThemePreference,
        timeZoneAbbreviation: timeZoneAbbreviation,
        uses24HourTime: uses24HourTime,
        starredPosts: storedStarredPosts,
        federatedAuthKeyPair: storedFederatedAuthKeyPair,
        userPreferences: storedUserPreferences,
        blueskyAccounts: storedBlueskyAccounts,
        mastodonAccountsAndServers: storedMastodonAccountsAndServers
      }
    });

    // Lets multiple tabs on the same origin stay in sync (e.g. signing in on
    // one tab shows the new account on all the others) -- every tab opens the
    // same named channel, so posting to it reaches every *other* tab (a
    // channel never receives its own posted messages) without any tab having
    // to poll localStorage. Falls back to a same-tab-only no-op where
    // `BroadcastChannel` doesn't exist (very old browsers).
    var accountsAndServersChannel = window.BroadcastChannel ? new BroadcastChannel("rellmAccountsAndServers") : null;
    if (accountsAndServersChannel) {
      accountsAndServersChannel.onmessage = function (e) {
        app.ports.accountsAndServersUpdated.send(e.data);
      };
    }

    app.ports.persistAccountsAndServers.subscribe(function (state) {
      localStorage.setItem("rellmState", JSON.stringify(state));
      if (accountsAndServersChannel) {
        accountsAndServersChannel.postMessage(state);
      }
    });

    app.ports.persistThemePreference.subscribe(function (preference) {
      localStorage.setItem("rellmThemePreference", preference);
    });

    // Unlike `starredPostsChannel`/`accountsAndServersChannel`, no
    // `BroadcastChannel` here -- see `Ports.persistUserPreferences`'s own doc
    // for why these are only ever read back at a fresh page load, not pushed
    // live into already-open tabs.
    app.ports.persistUserPreferences.subscribe(function (preferences) {
      localStorage.setItem("rellmUserPreferences", JSON.stringify(preferences));
    });

    // Same cross-tab sync as `accountsAndServersChannel`, above -- an enable/disable toggle or a
    // combined-feed-item reorder (see `Shared.AccountsPanel.CombinedFeedItem`) now shows up live in
    // every open tab, not just on that tab's next reload.
    var blueskyAccountsChannel = window.BroadcastChannel ? new BroadcastChannel("rellmBlueskyAccounts") : null;
    if (blueskyAccountsChannel) {
      blueskyAccountsChannel.onmessage = function (e) {
        app.ports.blueskyAccountsUpdated.send(e.data);
      };
    }

    app.ports.persistBlueskyAccounts.subscribe(function (blueskyAccounts) {
      localStorage.setItem("rellmBlueskyAccounts", JSON.stringify(blueskyAccounts));
      if (blueskyAccountsChannel) {
        blueskyAccountsChannel.postMessage(blueskyAccounts);
      }
    });

    var mastodonAccountsAndServersChannel = window.BroadcastChannel
      ? new BroadcastChannel("rellmMastodonAccountsAndServers")
      : null;
    if (mastodonAccountsAndServersChannel) {
      mastodonAccountsAndServersChannel.onmessage = function (e) {
        app.ports.mastodonAccountsAndServersUpdated.send(e.data);
      };
    }

    app.ports.persistMastodonAccountsAndServers.subscribe(function (mastodonAccountsAndServers) {
      localStorage.setItem("rellmMastodonAccountsAndServers", JSON.stringify(mastodonAccountsAndServers));
      if (mastodonAccountsAndServersChannel) {
        mastodonAccountsAndServersChannel.postMessage(mastodonAccountsAndServers);
      }
    });

    // Same cross-tab sync as `accountsAndServersChannel`, above.
    var starredPostsChannel = window.BroadcastChannel ? new BroadcastChannel("rellmStarredPosts") : null;
    if (starredPostsChannel) {
      starredPostsChannel.onmessage = function (e) {
        app.ports.starredPostsUpdated.send(e.data);
      };
    }

    app.ports.persistStarredPosts.subscribe(function (starredPosts) {
      localStorage.setItem("rellmStarredPosts", JSON.stringify(starredPosts));
      if (starredPostsChannel) {
        starredPostsChannel.postMessage(starredPosts);
      }
    });

    var currentThemePreference = storedThemePreference;

    app.ports.setTheme.subscribe(function (theme) {
      currentThemePreference = theme;
      if (theme === "auto") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", theme);
      }
      window.rellmUpdateCodeTheme(theme === "dark" || (theme === "auto" && darkMediaQuery.matches));
    });

    app.ports.setNavBarColor.subscribe(function (color) {
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        m.setAttribute("content", color);
      });
      forceSafeAreaRepaint();
    });

    // Works around a real WebKit/iOS bug (standalone/home-screen-installed PWAs only, where
    // apple-mobile-web-app-status-bar-style=black-translucent makes the status bar transparent and
    // shows .navbar's own background through it -- see this file's own comment on that meta tag):
    // when .navbar's background-color changes via a *later* stylesheet update (UI.EmittedStylesheet,
    // once a server's real ServerConfiguration/colors resolve, shortly after the app boots into a
    // server whose colors weren't known synchronously) rather than at the very first paint, iOS
    // sometimes fails to recomposite just the env(safe-area-inset-top) strip under the status bar --
    // it stays stuck showing whatever color (or lack of one) was there first, even though .navbar
    // itself repaints correctly right below it. Confirmed reproducing on some servers/posts and not
    // others, and self-correcting on some once *something else* forces a reflow later -- consistent
    // with a stuck compositor layer rather than a color actually being wrong. Toggling
    // viewport-fit=cover off and back on is a standard, narrowly-targeted way to force iOS to redo
    // safe-area layout/paint; called every time setNavBarColor fires (including the harmless initial
    // one at boot) rather than only once, since a server's colors can change again later too (e.g.
    // switching accounts to one on a different server).
    function forceSafeAreaRepaint() {
      var viewportMeta = document.querySelector('meta[name="viewport"]');
      if (!viewportMeta) { return; }
      var original = viewportMeta.getAttribute("content");
      if (!original || original.indexOf("viewport-fit=cover") === -1) { return; }
      viewportMeta.setAttribute("content", original.replace("viewport-fit=cover", "viewport-fit=auto"));
      requestAnimationFrame(function () {
        viewportMeta.setAttribute("content", original);
      });
    }

    // See Main.elm's splashOverlay doc comment: the `#splash` node this hides is Elm's own
    // (re-rendered on every `view` call from app boot onward), not the static one originally
    // written here -- `Browser.application` replaces this file's `#splash` the instant Elm's
    // first render runs, so this only ever needs to find Elm's copy.
    app.ports.hideSplash.subscribe(function () {
      setTimeout(() => {
        var el = document.getElementById("splash");
        if (el) { el.classList.add("hidden"); }
      }, 110);
    });

    app.ports.copyToClipboard.subscribe(function (text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      }
    });

    // OAuth login popup for `Components.EventSyncDestinations` -- deliberately hand-rolled instead
    // of loading Facebook's JS SDK: opening the popup here happens synchronously inside the
    // click's own event handler (the `Cmd` this port fires is processed synchronously by Elm's
    // runtime), which is what makes browsers -- especially mobile Safari -- reliably allow the
    // popup at all. Loading a third-party SDK first would introduce an async gap between the
    // click and the popup call, and popups opened after that gap get silently blocked on some
    // browsers. `redirectUri` points at our own tiny static `oauth-callback.html` (same
    // origin, no server round-trip) rather than Facebook's SDK-hosted proxy page -- shared by both
    // providers below, since it's the same static page either way.
    //
    // `payload.provider` picks which OAuth dialog to open -- `"facebook"` (used for both the
    // Facebook and Instagram flows, see Components.Pages.UserProfilePage's `FacebookConnectPlatform`)
    // is Facebook's own implicit flow (`response_type=token`); `"threads"` and `"x_twitter"` are
    // authorization-code flows (`response_type=code`) at threads.net/x.com respectively -- a
    // different domain/response shape from Facebook's, even though Threads rides on the very same
    // Meta App (`payload.appId` is the same value as Facebook/Instagram's there; X's is a wholly
    // separate app's Client ID). The popup-opening/sizing/polling/`postMessage`-listening code below
    // is one shared path for all three -- only the dialog URL/scope (and, for X, the PKCE
    // `code_verifier`/`code_challenge`) differ per provider.
    //
    // X mandates PKCE; this generates the `code_verifier` synchronously (`crypto.getRandomValues`)
    // and sends it as its own `code_challenge` unhashed (`code_challenge_method=plain`) rather than
    // the stronger `S256` -- computing a SHA-256 challenge needs `crypto.subtle.digest`, which only
    // ever returns a Promise, and awaiting it here would introduce the same kind of async gap this
    // whole synchronous-`window.open` approach exists to avoid (see the comment above). `plain` is a
    // real, spec-sanctioned PKCE mode, just a weaker one -- an honest, documented tradeoff instead.
    function generateXTwitterCodeVerifier() {
      var bytes = new Uint8Array(48);
      window.crypto.getRandomValues(bytes);
      var binary = "";
      for (var i = 0; i < bytes.length; i++) { binary += String.fromCharCode(bytes[i]); }
      // Base64url, no padding -- PKCE's `code_verifier` charset is [A-Za-z0-9-._~], and base64url's
      // (after the +//= substitutions below) is a subset of that.
      return window.btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    // Mastodon's PKCE `code_verifier` uses the stronger `S256` challenge method (unlike X's
    // `plain`, see `facebookLoginPopup`'s own doc) -- computing it needs `crypto.subtle.digest`,
    // which only ever returns a Promise, but Mastodon's flow already has to tolerate an async gap
    // before it has anything to redirect to at all (see `mastodonAuthorizeUrl` below), so there's
    // no synchronous-`window.open` constraint left to preserve by using the weaker method here.
    function generateMastodonCodeChallenge() {
      var bytes = new Uint8Array(48);
      window.crypto.getRandomValues(bytes);
      var binary = "";
      for (var i = 0; i < bytes.length; i++) { binary += String.fromCharCode(bytes[i]); }
      var codeVerifier = window.btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      return window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(codeVerifier)).then(function (digest) {
        var digestBytes = new Uint8Array(digest);
        var digestBinary = "";
        for (var i = 0; i < digestBytes.length; i++) { digestBinary += String.fromCharCode(digestBytes[i]); }
        var codeChallenge = window.btoa(digestBinary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        return { codeVerifier: codeVerifier, codeChallenge: codeChallenge };
      });
    }

    // Dynamically self-registers a throwaway OAuth app on `instanceHost` (Mastodon's own
    // `POST /api/v1/apps`) -- the fallback `facebookLoginPopup.subscribe`'s `"mastodon"` branch
    // uses only when `payload.appId` is blank (no admin-registered `MastodonServer` for this
    // instance); when it isn't, that real `appId` is used as `clientId` directly instead of calling
    // this at all, so every user connecting through the same admin-configured instance authorizes
    // the same, consistently-branded app rather than a fresh one per login. Returns a Promise of
    // `{ clientId }` (or rejects with an Error) -- there's no synchronous path here at all, since
    // registration itself is a network call. `clientId` is needed again at token-exchange time (see
    // `mastodonExchangeCode`), not just to build the authorize URL, so it's returned rather than
    // consumed here.
    function mastodonRegisterApp(instanceHost, redirectUri) {
      var body = new URLSearchParams();
      body.set("client_name", "Rellm");
      body.set("redirect_uris", redirectUri);
      body.set("scopes", "read");
      body.set("website", window.location.origin);
      return fetch("https://" + instanceHost + "/api/v1/apps", { method: "POST", body: body })
        .then(function (resp) {
          if (!resp.ok) { throw new Error("Couldn't register with " + instanceHost + "."); }
          return resp.json();
        })
        .then(function (app) {
          return { clientId: app.client_id };
        });
    }

    // Exchanges an authorization `code` for an access token directly against `instanceHost` -- no
    // `client_secret` at all, regardless of whether `clientId` is a throwaway app registered fresh
    // for this one login attempt (see `mastodonRegisterApp`) or an admin-registered `MastodonServer`
    // reused across every login on this instance (see `facebookLoginPopup.subscribe`'s own
    // `"mastodon"` branch): the PKCE `codeVerifier` alone is what proves this exchange came from the
    // same client that started the authorize request (the standard "public client" OAuth pattern),
    // and an admin-registered app's own `app_secret` never leaves the Rellm server in the first
    // place (see `MastodonServer.appSecret`'s own doc) for this to send even if it wanted to. Mirrors
    // how `mastodonRegisterApp` never asks the Rellm server for anything either: this whole flow is
    // between the browser and the Mastodon instance, no Rellm backend involved either way.
    // Returns `{ accessToken, refreshToken }` -- unlike the exchange itself, `refresh_token` isn't
    // guaranteed present (a Mastodon instance can omit it, e.g. if it's configured to issue
    // never-expiring tokens to third-party apps), so `refreshToken` may come back `null`; Elm's own
    // `mastodonLoginResultDecoder` treats that the same as "no refresh token available" -- this
    // account just won't self-heal past its access token's own (possibly infinite) lifetime.
    function mastodonExchangeCode(instanceHost, clientId, code, codeVerifier, redirectUri) {
      var body = new URLSearchParams();
      body.set("client_id", clientId);
      body.set("grant_type", "authorization_code");
      body.set("code", code);
      body.set("redirect_uri", redirectUri);
      body.set("code_verifier", codeVerifier);
      return fetch("https://" + instanceHost + "/oauth/token", { method: "POST", body: body })
        .then(function (resp) {
          if (!resp.ok) { throw new Error("Couldn't finish connecting to " + instanceHost + "."); }
          return resp.json();
        })
        .then(function (token) {
          return { accessToken: token.access_token, refreshToken: token.refresh_token || null };
        });
    }

    app.ports.facebookLoginPopup.subscribe(function (payload) {
      var redirectUri = window.location.origin + rellmBasePath + "/oauth-callback.html";
      var width = 600, height = 700;
      var left = window.screenX + Math.max(0, (window.outerWidth - width) / 2);
      var top = window.screenY + Math.max(0, (window.outerHeight - height) / 2);

      var dialogUrl;
      var xTwitterCodeVerifier = null;
      var mastodonCodeVerifier = null;
      var mastodonClientId = null;
      if (payload.provider === "threads") {
        dialogUrl = "https://threads.net/oauth/authorize" +
          "?client_id=" + encodeURIComponent(payload.appId) +
          "&redirect_uri=" + encodeURIComponent(redirectUri) +
          "&response_type=code" +
          "&scope=" + encodeURIComponent("threads_basic,threads_content_publish");
      } else if (payload.provider === "x_twitter") {
        xTwitterCodeVerifier = generateXTwitterCodeVerifier();
        dialogUrl = "https://x.com/i/oauth2/authorize" +
          "?client_id=" + encodeURIComponent(payload.appId) +
          "&redirect_uri=" + encodeURIComponent(redirectUri) +
          "&response_type=code" +
          "&scope=" + encodeURIComponent("tweet.read tweet.write users.read offline.access") +
          "&state=rellm" +
          "&code_challenge=" + encodeURIComponent(xTwitterCodeVerifier) +
          "&code_challenge_method=plain";
      } else if (payload.provider === "mastodon") {
        // Left null here -- there's nothing to redirect to yet (see below); the popup opens blank
        // and is navigated once registration/PKCE resolve.
        dialogUrl = null;
      } else {
        dialogUrl = "https://www.facebook.com/v19.0/dialog/oauth" +
          "?client_id=" + encodeURIComponent(payload.appId) +
          "&redirect_uri=" + encodeURIComponent(redirectUri) +
          "&response_type=token" +
          // Requested unconditionally regardless of whether the user clicked "Sign in to Facebook
          // Page" or "Sign in to Instagram" -- both flows start with the same "choose a Page" step
          // (see Components.Pages.UserProfilePage's `FacebookConnectPlatform`), so the popup always
          // asks for the union of scopes either flow could need.
          "&scope=" + encodeURIComponent("pages_show_list,pages_manage_posts,instagram_basic,instagram_content_publish");
      }

      var popup = window.open(
        dialogUrl || "",
        "rellm-oauth-login",
        "width=" + width + ",height=" + height + ",left=" + left + ",top=" + top
      );

      if (!popup) {
        app.ports.facebookLoginResult.send({ ok: false, value: "Couldn't open the login popup. Please allow popups for this site." });
        return;
      }

      var settled = false;
      var poll = setInterval(function () {
        if (popup.closed) {
          clearInterval(poll);
          if (!settled) {
            settled = true;
            window.removeEventListener("message", onMessage);
            app.ports.facebookLoginResult.send({ ok: false, value: "cancelled" });
          }
        }
      }, 500);

      function onMessage(e) {
        if (e.origin !== window.location.origin) { return; }
        if (!e.data || e.data.source !== "rellm-oauth-login") { return; }
        settled = true;
        window.removeEventListener("message", onMessage);
        clearInterval(poll);
        if (!e.data.accessToken) {
          app.ports.facebookLoginResult.send({ ok: false, value: e.data.error || "Login failed." });
        } else if (payload.provider === "mastodon") {
          // Unlike every other provider, `e.data.accessToken` here is still just the
          // authorization `code` -- Mastodon's flow finishes the token exchange itself (see
          // `mastodonExchangeCode`'s own doc on why that's safe with no `client_secret`), so Elm
          // only ever sees a real, usable access token, the same as every other provider's result.
          mastodonExchangeCode(payload.instanceHost, mastodonClientId, e.data.accessToken, mastodonCodeVerifier, redirectUri)
            .then(function (tokens) {
              // `clientId` rides along here too (see `mastodonRegisterApp`'s/the `clientId`
              // variable's own doc) -- Mastodon's refresh grant needs it again later (just
              // `client_id` + `refresh_token`, no PKCE/`client_secret`), and it's otherwise only
              // ever known inside this popup's own closure.
              app.ports.facebookLoginResult.send({
                ok: true,
                value: tokens.accessToken,
                refreshToken: tokens.refreshToken,
                clientId: mastodonClientId
              });
            })
            .catch(function (err) {
              app.ports.facebookLoginResult.send({ ok: false, value: err.message || "Couldn't finish connecting." });
            });
        } else {
          var result = { ok: true, value: e.data.accessToken };
          if (xTwitterCodeVerifier) { result.codeVerifier = xTwitterCodeVerifier; }
          app.ports.facebookLoginResult.send(result);
        }
      }
      window.addEventListener("message", onMessage);

      if (payload.provider === "mastodon") {
        generateMastodonCodeChallenge()
          .then(function (pkce) {
            mastodonCodeVerifier = pkce.codeVerifier;
            // Use the admin-registered app (see `MastodonConnectClicked`'s own doc) when there is
            // one -- only self-registering a throwaway app on the spot as a fallback for an instance
            // with none. Either way, no `client_secret` is ever sent here (an admin-registered app's
            // own secret never leaves the Rellm server at all -- see `MastodonServer.appSecret`'s own
            // doc) -- PKCE's `code_verifier` alone proves this exchange came from the same client
            // that started the authorize request, the standard "public client" pattern, regardless
            // of which kind of app this is.
            var clientIdPromise = payload.appId
              ? Promise.resolve(payload.appId)
              : mastodonRegisterApp(payload.instanceHost, redirectUri).then(function (app) { return app.clientId; });
            return clientIdPromise.then(function (clientId) {
              mastodonClientId = clientId;
              return "https://" + payload.instanceHost + "/oauth/authorize" +
                "?client_id=" + encodeURIComponent(clientId) +
                "&redirect_uri=" + encodeURIComponent(redirectUri) +
                "&response_type=code" +
                "&scope=" + encodeURIComponent("read") +
                "&code_challenge=" + encodeURIComponent(pkce.codeChallenge) +
                "&code_challenge_method=S256";
            });
          })
          .then(function (authorizeUrl) {
            if (popup.closed) { return; }
            popup.location.href = authorizeUrl;
          })
          .catch(function (err) {
            settled = true;
            window.removeEventListener("message", onMessage);
            clearInterval(poll);
            popup.close();
            app.ports.facebookLoginResult.send({ ok: false, value: err.message || "Couldn't connect to that Mastodon instance." });
          });
      }
    });

    // See Ports.elm's scrollElementLeft doc comment: Browser.Dom.setViewportOf
    // always assigns scrollLeft from inside a requestAnimationFrame callback,
    // which silently no-ops on an element with `scroll-behavior: smooth` --
    // this plain callback (not rAF-wrapped) doesn't have that problem.
    app.ports.scrollElementLeft.subscribe(function (payload) {
      var el = document.getElementById(payload.id);
      if (el) { el.scrollLeft = payload.left; }
    });

    // See Ports.elm's measureElements doc comment: Browser.Dom.getElement
    // wraps every call in its own requestAnimationFrame, so measuring a
    // whole list of elements one at a time (via Task.sequence) costs one
    // frame per element -- this plain callback measures them all in a
    // single JS turn instead. Each item is { key, id }: `id` is the actual
    // DOM id to look up, `key` is echoed back verbatim in the result so the
    // Elm side never has to reverse-derive its own caller-side key back out
    // of a DOM id string.
    //
    // `x`/`y` add `#app-scroll`'s own scrollLeft/scrollTop, not
    // window.pageXOffset/pageYOffset -- `#app-scroll` (see main.css's own
    // doc comment on it) is this app's one real scrolling element, `window`
    // itself never scrolls, so its own page offsets are permanently 0. This
    // mirrors elm/browser's kernel `Browser.Dom.getElement` exactly, which
    // used to add window.pageXOffset/pageYOffset for the same reason --
    // `Shared.appScrollDomId` on the Elm side is this same "app-scroll" id.
    app.ports.measureElements.subscribe(function (items) {
      var appScrollEl = document.getElementById("app-scroll");
      var scrollLeft = appScrollEl ? appScrollEl.scrollLeft : 0;
      var scrollTop = appScrollEl ? appScrollEl.scrollTop : 0;
      var results = [];
      for (var i = 0; i < items.length; i++) {
        var el = document.getElementById(items[i].id);
        if (!el) { continue; }
        var rect = el.getBoundingClientRect();
        results.push({
          key: items[i].key,
          x: rect.left + scrollLeft,
          y: rect.top + scrollTop,
          width: rect.width,
          height: rect.height
        });
      }
      app.ports.elementsMeasured.send(results);
    });

    // Renders/refreshes a FullCalendar instance inside the given container
    // id with the given events -- see Ports.elm's renderCalendar doc
    // comment. Keyed by container id (rather than a single global instance)
    // so a fresh container -- e.g. after `Components.Pages.EventsPage`
    // switches away from `Calendar` mode and back, which tears down and
    // rebuilds the DOM node -- gets a fresh FullCalendar instance instead of
    // trying to reuse one bound to a now-detached element. Deferred one
    // frame (`requestAnimationFrame`) since a mode switch's container may
    // not exist in the DOM yet the instant this fires -- Elm's own
    // `Browser.application` runtime defers painting a model change to the
    // next frame rather than doing it synchronously (see measureElements'
    // own analogous issue for `Components.Pages.EventsPage`'s FLIP
    // measurements).
    var rellmCalendars = {};
    app.ports.renderCalendar.subscribe(function (payload) {
      requestAnimationFrame(function () {
        var el = document.getElementById(payload.id);
        if (!el) { return; }
        var existing = rellmCalendars[payload.id];
        if (existing && existing.el === el) {
          existing.calendar.removeAllEventSources();
          existing.calendar.addEventSource(payload.events);
          return;
        }
        var calendar = new FullCalendar.Calendar(el, {
          initialView: payload.initialView || "timeGridWeek",
          headerToolbar: { left: "prev,next today", center: "title", right: "multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay" },
          height: "100%",
          // Makes day-of-month numbers (Month/Year views) and day-column
          // headers (Week view) clickable, jumping to that day's Day view --
          // off by default in FullCalendar.
          navLinks: true,
          // Forces every view (including month, whose default is a small
          // border-color-only dot + plain text) to render events as filled
          // chips instead -- otherwise each event's own `background-color`
          // (from its `classNames`, see Ports.elm's renderCalendar doc) has
          // nothing to visibly paint in month view.
          eventDisplay: "block",
          events: payload.events,
          // See Ports.elm's calendarEventClicked doc comment -- our own
          // events never set a `url`, so there's nothing for a default click
          // to navigate to anyway, but preventDefault stays cheap insurance
          // against FullCalendar ever changing that default.
          eventClick: function (info) {
            info.jsEvent.preventDefault();
            app.ports.calendarEventClicked.send(info.event.id);
          }
        });
        calendar.render();
        rellmCalendars[payload.id] = { el: el, calendar: calendar };
      });
    });

    // WEB PUSH (see Ports.elm's subscribeToPush/pushSubscribed/unsubscribeFromPush doc comments,
    // and public/service-worker.js for the `push`/`notificationclick` handlers themselves).
    // Registered unconditionally -- harmless no-op in browsers without `serviceWorker` support,
    // and a no-op everywhere until a user actually clicks "Enable notifications".
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register(rellmBasePath + "/service-worker.js").catch(function (e) {
        console.error("Failed to register service worker", e);
      });
      // See service-worker.js's own `push` handler doc comment: forwards its
      // `{ type: 'push-received', host }` postMessage to `Ports.pushMessageReceived`, so
      // `Components.Pages.MessagesPage` can refresh the relevant server's Messages the moment a
      // push actually arrives, not just when the resulting notification gets clicked.
      navigator.serviceWorker.addEventListener("message", function (event) {
        if (event.data && event.data.type === "push-received") {
          app.ports.pushMessageReceived.send(event.data.host || null);
        }
      });
    }

    function pushManagerAvailable() {
      return !!(window.PushManager && navigator.serviceWorker);
    }

    // iOS/iPadOS Safari only supports the Push API for a site that's been added to the Home
    // Screen (running "standalone") -- a regular browser tab can still resolve
    // `Notification.requestPermission()` (explaining why the permission prompt shows up), but
    // `pushManager.subscribe()` itself is unavailable/rejects there. Detected explicitly, ahead of
    // even asking for permission, so the error `pushSubscribed` reports is the actionable "add to
    // Home Screen first" rather than a bare "not supported"/AbortError once `subscribe()` fails.
    function isIosNonStandalone() {
      var isIos = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      return isIos && !isStandalone;
    }

    app.ports.subscribeToPush.subscribe(function (request) {
      if (isIosNonStandalone()) {
        app.ports.pushSubscribed.send({ ok: false, accountId: request.accountId, error: "On iOS, add this site to your Home Screen first (Share → Add to Home Screen), then enable notifications from there." });
        return;
      }
      if (!pushManagerAvailable()) {
        app.ports.pushSubscribed.send({ ok: false, accountId: request.accountId, error: "Push notifications aren't supported in this browser." });
        return;
      }
      if (Notification.permission === "denied") {
        app.ports.pushSubscribed.send({ ok: false, accountId: request.accountId, error: "Notifications are blocked for this site in your browser settings." });
        return;
      }
      Notification.requestPermission()
        .then(function (permission) {
          if (permission !== "granted") {
            app.ports.pushSubscribed.send({ ok: false, accountId: request.accountId, error: "Notification permission wasn't granted." });
            return null;
          }
          return navigator.serviceWorker.ready.then(function (registration) {
            // The Push API allows only one subscription per service worker at a time --
            // `subscribe()` rejects outright ("...applicationServerKey ... already exists") if one
            // is already active under a *different* key than the one being requested (e.g. this
            // browser subscribed once before, and the server's VAPID key has since changed/been
            // corrected). Clearing any existing subscription first makes re-subscribing always
            // work in that case, at the cost of a harmless new `endpoint`.
            //
            // But if the existing subscription's key already *matches* the one being requested --
            // the common case once a second local account on the same server enables notifications
            // too -- reuse it as-is instead: unsubscribing and resubscribing would still yield a
            // browser-level subscription, but Web Push services aren't required to hand back the
            // same `endpoint` for a fresh `subscribe()` call, so it'd risk orphaning whichever other
            // account(s) already registered the *old* endpoint server-side for no reason at all.
            return registration.pushManager.getSubscription().then(function (existing) {
              var existingKeyBytes = existing && existing.options && existing.options.applicationServerKey;
              var existingKeyEncoded = existingKeyBytes ? base64UrlEncode(existingKeyBytes) : null;
              if (existing && existingKeyEncoded === request.publicKey) {
                return existing;
              }
              return Promise.resolve(existing ? existing.unsubscribe() : null).then(function () {
                return registration.pushManager.subscribe({
                  userVisibleOnly: true,
                  applicationServerKey: base64UrlDecode(request.publicKey)
                });
              });
            });
          });
        })
        .then(function (subscription) {
          if (!subscription) { return; }
          var keys = subscription.toJSON().keys;
          app.ports.pushSubscribed.send({
            ok: true,
            accountId: request.accountId,
            endpoint: subscription.endpoint,
            p256dhKey: keys.p256dh,
            authKey: keys.auth
          });
        })
        .catch(function (e) {
          app.ports.pushSubscribed.send({ ok: false, accountId: request.accountId, error: String((e && e.message) || e) });
        });
    });

    app.ports.unsubscribeFromPush.subscribe(function (request) {
      if (!pushManagerAvailable()) { return; }
      navigator.serviceWorker.ready
        .then(function (registration) { return registration.pushManager.getSubscription(); })
        .then(function (subscription) {
          if (subscription && subscription.endpoint === request.endpoint) {
            return subscription.unsubscribe();
          }
        })
        .catch(function (e) {
          console.error("Failed to unsubscribe from push", e);
        });
    });

    app.ports.checkPushSubscription.subscribe(function () {
      if (!pushManagerAvailable()) {
        app.ports.pushSubscriptionChecked.send(null);
        return;
      }
      navigator.serviceWorker.getRegistration()
        .then(function (registration) {
          return registration ? registration.pushManager.getSubscription() : null;
        })
        .then(function (subscription) {
          if (!subscription) {
            app.ports.pushSubscriptionChecked.send(null);
            return;
          }
          // `subscription.options.applicationServerKey` is the raw bytes the subscription was
          // actually created with -- re-encoding it lets the Elm side match it back against a
          // specific account's server (`AccountsPanel.serverWebPushPublicKey`) without this port
          // needing to know anything about accounts itself. Not supported in every browser
          // (`options` can be missing), in which case the match just fails harmlessly and the
          // toggle falls back to its normal "off" state, same as before this port existed.
          var key = subscription.options && subscription.options.applicationServerKey;
          app.ports.pushSubscriptionChecked.send({
            endpoint: subscription.endpoint,
            publicKey: key ? base64UrlEncode(key) : ""
          });
        })
        .catch(function () {
          app.ports.pushSubscriptionChecked.send(null);
        });
    });

    // Same cross-tab sync as `accountsAndServersChannel`/`starredPostsChannel` above, but with no
    // `localStorage` write -- `pushSubscriptions` is itself never persisted (see its own doc
    // comment), so there's nothing to write, only to announce to already-open tabs.
    var pushSubscriptionChannel = window.BroadcastChannel ? new BroadcastChannel("rellmPushSubscriptions") : null;
    if (pushSubscriptionChannel) {
      pushSubscriptionChannel.onmessage = function (e) {
        app.ports.pushSubscriptionChangeReceived.send(e.data);
      };
    }

    app.ports.broadcastPushSubscriptionChange.subscribe(function (change) {
      if (pushSubscriptionChannel) {
        pushSubscriptionChannel.postMessage(change);
      }
    });

    darkMediaQuery.addEventListener("change", function (e) {
      app.ports.systemPrefersDarkChanged.send(e.matches);
      if (currentThemePreference === "auto") {
        window.rellmUpdateCodeTheme(e.matches);
      }
    });

    // FEDERATED AUTH -- SSO-style cross-server account hand-off (see
    // `Shared.FederatedAuth` and `Ports.elm`). Real ECIES-style hybrid
    // encryption -- ephemeral ECDH (P-256) + HKDF-SHA256 + AES-256-GCM --
    // via the browser's WebCrypto `SubtleCrypto` API, since Elm has no
    // crypto/bigint support of its own.

    function base64UrlEncode(bytes) {
      var binary = "";
      var arr = new Uint8Array(bytes);
      for (var i = 0; i < arr.length; i++) {
        binary += String.fromCharCode(arr[i]);
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function base64UrlDecode(str) {
      var padded = str.replace(/-/g, "+").replace(/_/g, "/");
      while (padded.length % 4 !== 0) {
        padded += "=";
      }
      var binary = atob(padded);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    // Both sides of an ECDH exchange derive the same shared secret from
    // their own private key and the other side's public key; HKDF turns
    // that into a proper AES-256-GCM key rather than using the raw shared
    // secret directly.
    function deriveAesKey(privateKey, publicKey) {
      return window.crypto.subtle
        .deriveBits({ name: "ECDH", public: publicKey }, privateKey, 256)
        .then(function (sharedSecret) {
          return window.crypto.subtle.importKey("raw", sharedSecret, "HKDF", false, ["deriveKey"]);
        })
        .then(function (hkdfKey) {
          return window.crypto.subtle.deriveKey(
            { name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: new Uint8Array(0) },
            hkdfKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
          );
        });
    }

    // `window.crypto.subtle` only exists in "secure contexts" -- HTTPS, or
    // plain HTTP on `localhost`/`127.0.0.1` specifically (browsers don't
    // extend that leniency to other hostnames, e.g. a `.local` mDNS alias,
    // even on the same machine). Accessing `.subtle`/its methods when it's
    // undefined throws *synchronously*, before any `.then`/`.catch` chain
    // exists to catch it -- left unguarded, that exception escapes into
    // Elm's scheduler and permanently wedges it (every port handler below
    // runs inside the same synchronous effects-dispatch loop), silently
    // breaking the entire app rather than just this feature. So every entry
    // point here checks up front and fails soft instead.
    function subtleCryptoAvailable() {
      return !!(window.crypto && window.crypto.subtle);
    }

    app.ports.federatedAuthGenerateKeyPair.subscribe(function () {
      if (!subtleCryptoAvailable()) {
        console.warn("Cross-host auth unavailable: WebCrypto requires a secure context (HTTPS, or http://localhost).");
        return;
      }
      try {
        window.crypto.subtle
          .generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"])
          .then(function (keyPair) {
            return Promise.all([
              window.crypto.subtle.exportKey("raw", keyPair.publicKey),
              window.crypto.subtle.exportKey("pkcs8", keyPair.privateKey)
            ]);
          })
          .then(function (exported) {
            app.ports.federatedAuthKeyPairGenerated.send({
              publicKey: base64UrlEncode(exported[0]),
              privateKey: base64UrlEncode(exported[1])
            });
          })
          .catch(function (e) {
            console.error("Failed to generate federated auth keypair", e);
          });
      } catch (e) {
        console.error("Failed to generate federated auth keypair", e);
      }
    });

    app.ports.persistFederatedAuthKeyPair.subscribe(function (keyPair) {
      localStorage.setItem("rellmFederatedAuthKeyPair", JSON.stringify(keyPair));
    });

    app.ports.clearFederatedAuthKeyPair.subscribe(function () {
      localStorage.removeItem("rellmFederatedAuthKeyPair");
    });

    // Encrypts `request.plaintext` to `request.publicKey` (the recipient's
    // public key) using a fresh, one-time ephemeral ECDH keypair -- the
    // encoded result is `ephemeralPublicKey.iv.ciphertext`, each part
    // base64url, dot-joined (`@` is reserved for the `/auth/to` route's own
    // `key@host` split).
    app.ports.federatedAuthEncrypt.subscribe(function (request) {
      if (!subtleCryptoAvailable()) {
        app.ports.federatedAuthEncrypted.send({ ok: false, value: "Cross-host auth requires a secure context (HTTPS, or http://localhost)." });
        return;
      }
      var ephemeralKeyPair;
      var iv;
      try {
        window.crypto.subtle
          .importKey("raw", base64UrlDecode(request.publicKey), { name: "ECDH", namedCurve: "P-256" }, false, [])
          .then(function (recipientPublicKey) {
            return window.crypto.subtle
              .generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"])
              .then(function (kp) {
                ephemeralKeyPair = kp;
                return deriveAesKey(kp.privateKey, recipientPublicKey);
              });
          })
          .then(function (aesKey) {
            iv = window.crypto.getRandomValues(new Uint8Array(12));
            var plaintextBytes = new TextEncoder().encode(request.plaintext);
            return Promise.all([
              window.crypto.subtle.exportKey("raw", ephemeralKeyPair.publicKey),
              window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, plaintextBytes)
            ]);
          })
          .then(function (results) {
            var encoded =
              base64UrlEncode(results[0]) + "." + base64UrlEncode(iv) + "." + base64UrlEncode(results[1]);
            app.ports.federatedAuthEncrypted.send({ ok: true, value: encoded });
          })
          .catch(function (e) {
            app.ports.federatedAuthEncrypted.send({ ok: false, value: String((e && e.message) || e) });
          });
      } catch (e) {
        app.ports.federatedAuthEncrypted.send({ ok: false, value: String((e && e.message) || e) });
      }
    });

    // Inverse of the above: `request.encoded` was produced by some other
    // origin's `federatedAuthEncrypt` against this origin's own public key,
    // so decrypting it just needs this origin's matching private key.
    app.ports.federatedAuthDecrypt.subscribe(function (request) {
      if (!subtleCryptoAvailable()) {
        app.ports.federatedAuthDecrypted.send({ ok: false, value: "Cross-host auth requires a secure context (HTTPS, or http://localhost)." });
        return;
      }
      var ephemeralPublicKeyBytes, iv, ciphertext;
      try {
        var parts = request.encoded.split(".");
        if (parts.length !== 3) {
          throw new Error("Malformed encrypted account data.");
        }
        ephemeralPublicKeyBytes = base64UrlDecode(parts[0]);
        iv = base64UrlDecode(parts[1]);
        ciphertext = base64UrlDecode(parts[2]);
      } catch (e) {
        app.ports.federatedAuthDecrypted.send({ ok: false, value: String((e && e.message) || e) });
        return;
      }

      try {
        Promise.all([
          window.crypto.subtle.importKey(
            "pkcs8", base64UrlDecode(request.privateKey), { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]
          ),
          window.crypto.subtle.importKey("raw", ephemeralPublicKeyBytes, { name: "ECDH", namedCurve: "P-256" }, false, [])
        ])
          .then(function (keys) {
            return deriveAesKey(keys[0], keys[1]);
          })
          .then(function (aesKey) {
            return window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, ciphertext);
          })
          .then(function (plaintextBytes) {
            app.ports.federatedAuthDecrypted.send({ ok: true, value: new TextDecoder().decode(plaintextBytes) });
          })
          .catch(function (e) {
            app.ports.federatedAuthDecrypted.send({ ok: false, value: String((e && e.message) || e) });
          });
      } catch (e) {
        app.ports.federatedAuthDecrypted.send({ ok: false, value: String((e && e.message) || e) });
      }
    });
  </script>
