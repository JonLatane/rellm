      - name: Update deploys/k8s/preview_generator.yaml to use ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: sed -i 's|${{ steps.vars.outputs.be_version }}|${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}|g' deploys/k8s/preview_generator.yaml

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      - name: Deploy to Jonline.io via DigitalOcean Kubernetes
        run: kubectl apply -f deploys/k8s/preview_generator.yaml -n jonline

  create_github_release:
    name: "GitHub: Release"
    # permissions: write-all
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - deploy_jonlineio_server
      - deploy_jonlineio_preview_generator
      - push_server
      - push_preview_generator
      - test_consistency
      - test_rust_binaries
      - test_flutter_ui
      - test_tamagui_ui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Versioning Data
        id: vars
        run: |-
          be_version="$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/\"//g')"
          dated_sha_short="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "be_version=${be_version}" >> $GITHUB_OUTPUT
          echo "dated_sha_short=${dated_sha_short}" >> $GITHUB_OUTPUT
          echo "full_version=${be_version}-${dated_sha_short}" >> $GITHUB_OUTPUT

      - name: Store Versioning Data for release ${{ steps.vars.outputs.full_version }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Push tag v${{ steps.vars.outputs.full_version }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: "${{ steps.vars.outputs.full_version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Changelog
        id: changelog
        run: |
          delimiter="$(openssl rand -hex 32)"
          echo "ci_changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$(git --no-pager log -10 --pretty='- [`%h` / *%ch*] %B')" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
      - name: Display Changelog (for debugging the CI/CD process)
        env:
          # Piped through an env var (rather than interpolated directly into the script below)
          # because commit messages routinely contain backticks/`$()`/parens for Markdown code
          # formatting -- inlining `${{ }}` straight into a run: script splices that text into the
          # shell source itself, so bash tries to execute every backtick-quoted identifier as a
          # command substitution. Referencing it as "$CI_CHANGELOG" instead treats it as inert data.
          CI_CHANGELOG: ${{ steps.changelog.outputs.ci_changelog }}
        run: |
          printf 'The string is: \n%s\n' "$CI_CHANGELOG"

      - name: Create release v${{ steps.vars.outputs.full_version }}
        uses: ncipollo/release-action@v1
        with:
          name: "v${{ steps.vars.outputs.full_version }} (CI/CD)"
          tag: "v${{ steps.vars.outputs.full_version }}"
          makeLatest: true
          body: |-
            # Rellm CI/CD Release

            ### `v${{ steps.vars.outputs.full_version }}`

            Built by the [Server CI/CD GitHub Action ![Server CI/CD Badge](https://github.com/jonlatane/rellm/actions/workflows/server_ci_cd.yml/badge.svg)](https://github.com/jonlatane/rellm/actions/workflows/server_ci_cd.yml).

            Images are available on DockerHub:

            - [DockerHub: Rellm Server (jonlatane/rellm:${{ steps.vars.outputs.full_version }})](https://hub.docker.com/r/jonlatane/rellm/tags?page=1&name=${{ steps.vars.outputs.full_version }})

            - [DockerHub: Rellm Preview Generator (jonlatane/rellm_preview_generator:${{ steps.vars.outputs.full_version }})](https://hub.docker.com/r/jonlatane/rellm_preview_generator/tags?page=1&name=${{ steps.vars.outputs.full_version }})

            - *In testing/not yet ready for production use:* [DockerHub: JBL (Rellm Balancer of Loads/Load Balancer) (jonlatane/jbl:${{ steps.vars.outputs.full_version }})](https://hub.docker.com/r/jonlatane/rellm_preview_generator/tags?page=1&name=${{ steps.vars.outputs.full_version }})

            A macOS (Apple Silicon) build is also available via Homebrew:

            ```
            brew install jonlatane/rellm/rellm
            ```

            A self-updating Linux build (amd64/arm64) is available as a release tarball:

            ```
            curl -s https://api.github.com/repos/jonlatane/rellm/releases/latest \
              | jq -r '.assets[] | select(.name | test("-linux\\.tar\\.bz2$")) | .browser_download_url' \
              | xargs curl -L -o rellm.tar.bz2
            mkdir rellm && tar xjf rellm.tar.bz2 -C rellm && rm rellm.tar.bz2
            cd rellm
            ./bin/rellm version
            ```

            Run `./bin/rellm help` for other commands, including `update` to self-update in place.

            ## Deployments

            Deployments will be brought up-to-date at around the same time as this release is created.

            First, Jonline.io (and any other "development" deployments) will be updated.

            Then, this release is created (so, Jonline.io should already be updated).

            Finally, Bull City Social and Oak City Social (and any other "production" deployments) will be updated.

            | Deployment | Links | Deployment Version |
            | --- | --- | --- |
            | [Jonline.io ![Jonline.io](https://jonline.io/info_shield?56fdas586)](https://jonline.io)                      | [About](https://jonline.io/about), [Protocol Docs](https://rellm.org/docs/protocol/)           | Development |
            | [BullCity.Social ![BullCity.Social](https://BullCity.Social/info_shield?56fdas586)](https://BullCity.Social/) | [About](https://BullCity.Social/about), [Protocol Docs](https://BullCity.Social/docs/protocol/) | Production  |
            | [OakCity.Social ![OakCity.Social](https://OakCity.Social/info_shield?56fdas586)](https://OakCity.Social/)     | [About](https://OakCity.Social/about), [Protocol Docs](https://OakCity.Social/docs/protocol/)   | Production  |

            ## Changelog

            This list's Markdown was generated with `git log -100 --pretty='- [%h / *%ch*] %B'` at release time:

            ${{ steps.changelog.outputs.ci_changelog }}

  create_homebrew_release:
    name: "Homebrew: Release"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - create_github_release
      - build_rust_binaries_macos
      - build_flutter_ui
      - build_tamagui_ui
      - build_elm_ui
      - test_consistency

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          be_version="$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')"
          dated_sha_short="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "be_version=${be_version}" >> $GITHUB_OUTPUT
          echo "dated_sha_short=${dated_sha_short}" >> $GITHUB_OUTPUT
          echo "full_version=${be_version}-${dated_sha_short}" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.full_version }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: actions/cache/restore@v6
        id: web-app-cache
        with:
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          key: web-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        id: elm-app-cache
        with:
          path: frontends/elm-spa/public
          key: elm-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        id: flutter-app-cache
        with:
          path: frontends/flutter/build/web
          key: flutter-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        id: rust-macos-app-cache
        with:
          path: backend/target/release
          key: rust-macos-arm64-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

      # Mirrors deploys/docker/server/Dockerfile's /opt layout, but rooted at a
      # staging dir that becomes /opt/homebrew/etc/rellm on the installed Mac.
      - name: Assemble /opt/homebrew/etc/rellm package layout
        run: |
          set -euo pipefail
          PKG=rellm_pkg
          rm -rf "$PKG"
          mkdir -p "$PKG"

          for bin in rellm disable_cdn_grpc delete_expired_tokens delete_unowned_media \
                     sync_sources update_user_counts convert_media_sizes renew_market_subscriptions generate_preview_images delete_preview_images \
                     set_permission free_all_cluster_resources to_db_id to_proto_id; do
            cp "backend/target/release/${bin}" "$PKG/${bin}"
            chmod +x "$PKG/${bin}"
          done

          cp backend/background_jobs.sh "$PKG/background_jobs.sh"
          chmod +x "$PKG/background_jobs.sh"

          mv "$PKG/rellm" "$PKG/rellm-server"

          # backend/src/web/*.rs read frontend/doc assets via CWD-relative
          # "opt/..." paths (mirroring deploys/docker/server/Dockerfile, which
          # COPYs to /opt/... and runs with CWD "/") -- docs/rellm_homebrew.sh
          # cd's into this package dir before exec'ing the server, so those
          # assets need to live under an "opt/" subdir here too, not the
          # package root.
          mkdir -p "$PKG/opt/docs" "$PKG/opt/tamagui_web" "$PKG/opt/tamagui_web_tamagui" "$PKG/opt/elm_web" "$PKG/opt/flutter_web" "$PKG/opt/deploys"
          cp deploys/docker/continuous_delivery_hash "$PKG/opt/continuous_delivery_hash"
          cp docs/protocol.html "$PKG/opt/docs/protocol.html"
          cp -R frontends/tamagui/apps/next/out/. "$PKG/opt/tamagui_web/"
          cp -R frontends/tamagui/apps/next/out-tamagui/. "$PKG/opt/tamagui_web_tamagui/"
          cp -R frontends/elm-spa/public/. "$PKG/opt/elm_web/"
          cp -R frontends/flutter/build/web/. "$PKG/opt/flutter_web/"

          # Bundled so `rellm deploy <targets...>` (docs/rellm_homebrew.sh) can run these
          # Makefile targets against your own K8s cluster -- see deploys/distributables.sh.
          # Checkout is fresh here, so this can't pick up gitignored local state (generated_certs'
          # private keys, deploys/backups' Postgres dumps, etc.) -- only what's actually tracked.
          cp -R deploys/. "$PKG/opt/deploys/"

          # grpcurl is useful to have on a rellm instance (see Dockerfile) --
          # osx_arm64 build, matching the version pinned there.
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_osx_arm64.tar.gz" | tar -xz -C "$PKG" grpcurl

          tar czf "rellm-${{ steps.vars.outputs.full_version }}-macos-arm64.tar.gz" -C "$PKG" .

      - name: Compute sha256
        id: sha
        run: echo "sha256=$(sha256sum rellm-${{ steps.vars.outputs.full_version }}-macos-arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload release asset to v${{ steps.vars.outputs.full_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.vars.outputs.full_version }}" "rellm-${{ steps.vars.outputs.full_version }}-macos-arm64.tar.gz" --repo jonlatane/rellm --clobber

      - name: Push Formula/rellm.rb to JonLatane/homebrew-rellm
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/JonLatane/homebrew-rellm.git" tap

          cat > tap/Formula/rellm.rb <<'RELLM_FORMULA_HEADER_EOF'
          # This file is generated and pushed automatically by the Server CI/CD workflow
          # (create_homebrew_release job) in https://github.com/jonlatane/rellm on every
          # release to main. Don't hand-edit it -- changes will be overwritten. The launcher
          # script below is sourced from docs/rellm_homebrew.sh in that repo.
          class Rellm < Formula
            desc "Rellm federated social server"
            homepage "https://github.com/jonlatane/rellm"
            url "https://github.com/jonlatane/rellm/releases/download/vFULL_VERSION_PLACEHOLDER/rellm-FULL_VERSION_PLACEHOLDER-macos-arm64.tar.gz"
            sha256 "SHA256_PLACEHOLDER"
            version "FULL_VERSION_PLACEHOLDER"
            license "AGPL-3.0-only"

            depends_on arch: :arm64
            depends_on "libpq"

            def install
              (etc/"rellm").install Dir["*"]
              (bin/"rellm").write <<~SCRIPT
          RELLM_FORMULA_HEADER_EOF

          # docs/rellm_homebrew.sh is plain, standalone bash aside from the
          # @@RELLM_ETC@@ placeholder, which becomes Ruby's `#{etc}` interpolation
          # here -- Homebrew resolves that to the real install prefix at `brew install`
          # time, so it can't be a fixed value baked in at CI time.
          sed -e 's/@@RELLM_ETC@@/#{etc}/' -e 's/^/                /' docs/rellm_homebrew.sh >> tap/Formula/rellm.rb

          cat >> tap/Formula/rellm.rb <<'RELLM_FORMULA_FOOTER_EOF'
              SCRIPT
              chmod 0755, bin/"rellm"

              # bin/"rellm" implements `completion bash`/`completion zsh` (see
              # docs/rellm_homebrew.sh) as a positional arg, not a `--shell=`
              # flag, so shell_parameter_format is left at its nil default --
              # Homebrew's :arg format actually means `--shell=bash`, despite
              # the name. This runs `rellm completion bash`/`completion zsh`
              # to capture the scripts, which Homebrew installs into the
              # right completions dirs.
              generate_completions_from_executable(bin/"rellm", "completion", shells: [:bash, :zsh])
            end

            test do
              system "#{bin}/rellm", "version"
            end
          end
          RELLM_FORMULA_FOOTER_EOF

          sed -i "s|FULL_VERSION_PLACEHOLDER|${{ steps.vars.outputs.full_version }}|g" tap/Formula/rellm.rb
          sed -i "s|SHA256_PLACEHOLDER|${{ steps.sha.outputs.sha256 }}|g" tap/Formula/rellm.rb

          cd tap
          git -c user.name="Rellm CI" -c user.email="ci@jonline.io" add Formula/rellm.rb
          if git diff --cached --quiet; then
            echo "No Formula changes to push"
          else
            git -c user.name="Rellm CI" -c user.email="ci@jonline.io" commit -m "rellm ${{ steps.vars.outputs.full_version }}"
            git push origin main
          fi

  create_linux_release:
    name: "Linux: Release"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - create_github_release
      - build_rust_binaries_linux_amd64_static
      - build_rust_binaries_linux_arm64_static
      - build_flutter_ui
      - build_tamagui_ui
      - build_elm_ui
      - test_consistency

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          be_version="$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')"
          dated_sha_short="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "be_version=${be_version}" >> $GITHUB_OUTPUT
          echo "dated_sha_short=${dated_sha_short}" >> $GITHUB_OUTPUT
          echo "full_version=${be_version}-${dated_sha_short}" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.full_version }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: actions/cache/restore@v6
        id: web-app-cache
        with:
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          key: web-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        id: elm-app-cache
        with:
          path: frontends/elm-spa/public
          key: elm-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        id: flutter-app-cache
        with:
          path: frontends/flutter/build/web
          key: flutter-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

      # Both cached builds were saved from the same "backend/target/release"
      # path, so they're restored one at a time and moved aside immediately --
      # restoring both to that path in one job would have the second clobber
      # the first.
      - uses: actions/cache/restore@v6
        id: rust-linux-amd64-static-app-cache
        with:
          path: backend/target/release
          key: rust-linux-amd64-static-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - run: mv backend/target/release backend/target/release-amd64

      - uses: actions/cache/restore@v6
        id: rust-linux-arm64-static-app-cache
        with:
          path: backend/target/release
          key: rust-linux-arm64-static-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - run: mv backend/target/release backend/target/release-arm64

      # Mirrors deploys/docker/server/Dockerfile's /opt layout (and the
      # Homebrew package layout above), but with binaries for every built
      # architecture side-by-side (arch-suffixed) instead of just one, since
      # this tarball can be extracted onto any Linux machine.
      - name: Assemble Linux release package layout
        run: |
          set -euo pipefail
          PKG=rellm_linux_pkg
          rm -rf "$PKG"
          mkdir -p "$PKG/bin"

          for arch in amd64 arm64; do
            src="backend/target/release-${arch}"
            for bin in rellm disable_cdn_grpc delete_expired_tokens delete_unowned_media \
                       sync_sources update_user_counts convert_media_sizes renew_market_subscriptions generate_preview_images delete_preview_images \
                       set_permission free_all_cluster_resources to_db_id to_proto_id; do
              cp "${src}/${bin}" "$PKG/${bin}-${arch}"
              chmod +x "$PKG/${bin}-${arch}"
            done
            mv "$PKG/rellm-${arch}" "$PKG/rellm-server-${arch}"
          done

          cp backend/background_jobs.sh "$PKG/background_jobs.sh"
          chmod +x "$PKG/background_jobs.sh"

          echo "${{ steps.vars.outputs.full_version }}" > "$PKG/version"

          # backend/src/web/*.rs read frontend/doc assets via CWD-relative
          # "opt/..." paths (mirroring deploys/docker/server/Dockerfile, which
          # COPYs to /opt/... and runs with CWD "/") -- docs/rellm_linux.sh
          # cd's into this package dir before exec'ing the server, so those
          # assets need to live under an "opt/" subdir here too, not the
          # package root.
          mkdir -p "$PKG/opt/docs" "$PKG/opt/tamagui_web" "$PKG/opt/tamagui_web_tamagui" "$PKG/opt/elm_web" "$PKG/opt/flutter_web" "$PKG/opt/deploys"
          cp deploys/docker/continuous_delivery_hash "$PKG/opt/continuous_delivery_hash"
          cp docs/protocol.html "$PKG/opt/docs/protocol.html"
          cp -R frontends/tamagui/apps/next/out/. "$PKG/opt/tamagui_web/"
          cp -R frontends/tamagui/apps/next/out-tamagui/. "$PKG/opt/tamagui_web_tamagui/"
          cp -R frontends/elm-spa/public/. "$PKG/opt/elm_web/"
          cp -R frontends/flutter/build/web/. "$PKG/opt/flutter_web/"

          # Bundled so `rellm deploy <targets...>` (docs/rellm_linux.sh) can run these
          # Makefile targets against your own K8s cluster -- see deploys/distributables.sh.
          # Checkout is fresh here, so this can't pick up gitignored local state (generated_certs'
          # private keys, deploys/backups' Postgres dumps, etc.) -- only what's actually tracked.
          cp -R deploys/. "$PKG/opt/deploys/"

          # grpcurl is useful to have on a rellm instance (see Dockerfile) --
          # one per architecture, matching the version pinned there.
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_x86_64.tar.gz" | tar -xz -C "$PKG" grpcurl
          mv "$PKG/grpcurl" "$PKG/grpcurl-amd64"
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_arm64.tar.gz" | tar -xz -C "$PKG" grpcurl
          mv "$PKG/grpcurl" "$PKG/grpcurl-arm64"

          # docs/rellm_linux.sh is plain, standalone bash aside from the
          # @@RELLM_PACKAGE_BASE_DIR@@ placeholder -- unlike Homebrew's
          # @@RELLM_ETC@@ (Ruby-interpolated at `brew install` time), this
          # tarball can be extracted anywhere, so a concrete default install
          # dir is baked in here at CI time instead. It stays as unexpanded
          # shell syntax so it resolves against whichever user's $HOME
          # actually runs it.
          sed 's|@@RELLM_PACKAGE_BASE_DIR@@|$HOME/.rellm-linux|' docs/rellm_linux.sh > "$PKG/bin/rellm"
          chmod +x "$PKG/bin/rellm"

          tar cjf "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2" -C "$PKG" .

      - name: Compute sha256
        run: sha256sum "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2" > "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2.sha256"

      - name: Upload release assets to v${{ steps.vars.outputs.full_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.vars.outputs.full_version }}" \
            "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2" \
            "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2.sha256" \
            --repo jonlatane/rellm --clobber

