  bounce_traefik_production:
    name: Bounce Traefik (Production)
    # deploy_bullcitysocial, deploy_oakcitysocial, deploy_ato_band, deploy_rellm_org, and
    # deploy_neurospicysteve_bullcity_social run concurrently, so this waits on all five and bounces Traefik once for the group --
    # rather than once per namespace -- since any deploy's pod churn can wedge Traefik's
    # TLS-passthrough routing (see the matching step in deploy_jonlineio_server). Runs
    # if any succeeded, since a partial-success deploy still churns pods and can still
    # wedge routing.
    needs:
      - deploy_bullcitysocial
      - deploy_oakcitysocial
      - deploy_ato_band
      - deploy_rellm_org
      - deploy_neurospicysteve_bullcity_social
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (needs.deploy_bullcitysocial.result == 'success' || needs.deploy_oakcitysocial.result == 'success' || needs.deploy_ato_band.result == 'success' || needs.deploy_rellm_org.result == 'success' || needs.deploy_neurospicysteve_bullcity_social.result == 'success')
    runs-on: ubuntu-26.04

    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      - name: Bounce Traefik to refresh routing
        run: |
          kubectl rollout restart deployment traefik -n traefik-ingress
          kubectl rollout status deployment traefik -n traefik-ingress --timeout 5m

  # CI applies only some manifests (see the header comment): the central-storage namespaces' server,
  # preview generator and vector service, and the cluster's embedding service. When a push changes any
  # OTHER deploy manifest, say so loudly: the new image will run against the OLD manifest until someone
  # rolls it out.
  manifest_change_notice:
    name: Notice if deploy manifests changed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Warn when deploy manifests CI doesn't apply changed
        run: |-
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- deploys/k8s deploys/central_storage/k8s \
            ':!deploys/k8s/server_internal_central_data.yaml' ':!deploys/k8s/preview_generator_central_data.yaml' \
            ':!deploys/k8s/vector_search_service_central_data.yaml' ':!deploys/central_storage/k8s/k8s-central-embedding-service.yaml' \
            2>/dev/null | tr '\n' ' ' || true)"
          if [ -n "$changed" ]; then
            echo "::warning title=Deploy manifests changed::CI doesn't apply these. Roll them out yourself (deploys/README.md, 'Rolling out manifest changes'): $changed"
            {
              echo "### Deploy manifests changed -- manual rollout needed"
              echo "CI applies only the central-storage server/preview/vector manifests and the embedding service's; these changed but weren't applied."
              echo "Changed: \`$changed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
