  bounce_traefik_production:
    name: Bounce Traefik (Production)
    # deploy_bullcitysocial, deploy_oakcitysocial, deploy_ato_band, and deploy_rellm_org
    # run concurrently, so this waits on all four and bounces Traefik once for the group --
    # rather than once per namespace -- since any deploy's pod churn can wedge Traefik's
    # TLS-passthrough routing (see the matching step in deploy_jonlineio_server). Runs
    # if any succeeded, since a partial-success deploy still churns pods and can still
    # wedge routing.
    needs:
      - deploy_bullcitysocial
      - deploy_oakcitysocial
      - deploy_ato_band
      - deploy_rellm_org
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (needs.deploy_bullcitysocial.result == 'success' || needs.deploy_oakcitysocial.result == 'success' || needs.deploy_ato_band.result == 'success' || needs.deploy_rellm_org.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      - name: Bounce Traefik to refresh routing
        run: |
          kubectl rollout restart deployment traefik -n traefik-ingress
          kubectl rollout status deployment traefik -n traefik-ingress --timeout 5m
