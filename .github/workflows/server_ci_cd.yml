  deploy_jonlineio_server:
    name: Deploy Jonline.io Server
    if: github.ref == 'refs/heads/main'
    needs:
      - test_rust_binaries
      - test_flutter_ui
      - test_tamagui_ui
      - push_server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update deploys/k8s/server_internal.yaml to use ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: sed -i 's|${{ steps.vars.outputs.be_version }}|${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}|g' deploys/k8s/server_internal.yaml

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      # If you haven't already integrated with your registry and only want workloads in a particular namespace to be able to pull
      # from your registry, uncomment the next two commands.
      # - name: Upload credentials of your registry to your DigitalOcean Kubernetes cluster
      #   run: doctl registry kubernetes-manifest | kubectl apply -f -

      # - name: Reference the secret you just uploaded as an imagePullSecrets
      #   run: "kubectl patch serviceaccount default -p '{\"imagePullSecrets\": [{\"name\": \"registry-<your-registry-name>`\"}]}'"

      - name: Delete stray CronJobs (background jobs moved to the rellm-jobs Deployment)
        run: kubectl delete cronjob --all -n jonline --ignore-not-found=true

      - name: Deploy to Jonline.io via DigitalOcean Kubernetes
        run: kubectl apply -f deploys/k8s/server_internal.yaml -n jonline

      - name: Verify Server deployment
        run: kubectl rollout status deployment/rellm -n jonline --timeout 5m

      # Traefik's TLS-passthrough IngressRouteTCP routing (see rellm-https/rellm-grpc)
      # can get wedged pointing at stale backend pod IPs after a rollout replaces pods --
      # this refreshes it so jonline.io doesn't silently start 404ing/hanging post-deploy.
      - name: Bounce Traefik to refresh routing
        run: |
          kubectl rollout restart deployment traefik -n traefik-ingress
          kubectl rollout status deployment traefik -n traefik-ingress --timeout 5m

      - uses: actions/cache/restore@v6
        with:
          path: frontends/flutter/build/web
          key: flutter-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          key: web-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
      - uses: actions/cache/restore@v6
        with:
          path: frontends/elm-spa/public
          key: elm-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_JONLINEIO }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: .github/workflows/scripts/purge_cloudflare_cache.sh jonline.io

  deploy_jonlineio_preview_generator:
