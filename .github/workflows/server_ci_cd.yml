# Note that the deploy steps expect that backend/Cargo.toml and deploys/k8s/server_internal.yaml
# have the same version number.
name: Server CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: "DockerHub username for CD"
        required: true
      DOCKERHUB_TOKEN:
        description: "DockerHub access token for CD"
        required: true
      DIGITALOCEAN_ACCESS_TOKEN:
        description: "DigitalOcean access token for CD"
        required: true
      CLOUDFLARE_TOKEN:
        description: "Cloudflare API token for CD"
        required: true
      CLOUDFLARE_ZONE_JONLINEIO:
        description: "Cloudflare Zone ID for Jonline.io"
        required: true
      CLOUDFLARE_ZONE_BULLCITY_SOCIAL:
        description: "Cloudflare Zone ID for Bull City Social"
        required: true
      CLOUDFLARE_ZONE_OAKCITY_SOCIAL:
        description: "Cloudflare Zone ID for Oak City Social"
        required: true
      CLOUDFLARE_ZONE_ATO_BAND:
        description: "Cloudflare Zone ID for Ato Band"
        required: true
      CLOUDFLARE_ZONE_RELLM_ORG:
        description: "Cloudflare Zone ID for Rellm.org"
        required: true
      HOMEBREW_TAP_TOKEN:
        description: "GitHub PAT with contents:write on JonLatane/homebrew-rellm, used to push Formula updates"
        required: true

jobs:
  test_consistency:
    name: Test Proto/Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: |
          PROTOC_VERSION=29.6
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version
      # - name: Install Graphviz
      #   run: sudo apt-get update && sudo apt-get install -y graphviz
      # - uses: subosito/flutter-action@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - run: npm install --global yarn

      - name: Get yarn cache directory path
        working-directory: frontends/tamagui
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        # id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: rellm-consistency-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            rellm-consistency-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - working-directory: frontends/tamagui
        run: yarn install
      - working-directory: frontends/tamagui
        run: yarn version:install

      - name: Build Markdown & HTML docs
        # run: make documentation html_docs
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: make documentation html_docs

      # TODO: GraphViz versions produce different diagram outputs.
      # My local Homebrew version is 9.0.0 (20230911.1827),
      # GitHub Actions is 2.43.0 (0)
      # - name: Build Graphviz diagrams
      #   run: make graphs

      - name: Install protoc-gen-elm
        run: yarn global add protoc-gen-elm

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - name: Cache pinned Flutter SDK (FVM)
        uses: actions/cache@v6
        with:
          path: ~/fvm/versions
          key: fvm-flutter-${{ hashFiles('frontends/flutter/.fvmrc') }}

      - working-directory: frontends/flutter
        run: fvm install

      - name: Build Protos
        run: make protos

      - name: Check for changes
        run: git diff --exit-code --ignore-matching-lines='//   protoc +v[\\.0-9]+' --ignore-matching-lines='- `protoc` [0-9]'

  build_flutter_ui:
    name: Build Flutter Web UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      # frontends/flutter is frozen and pinned via FVM (see frontends/flutter/.fvmrc
      # and frontends/flutter/README.md) rather than tracking the `stable` channel,
      # so it's set up here instead of via subosito/flutter-action.
      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - name: Cache pinned Flutter SDK (FVM)
        uses: actions/cache@v6
        with:
          path: ~/fvm/versions
          key: fvm-flutter-${{ hashFiles('frontends/flutter/.fvmrc') }}

      - working-directory: frontends/flutter
        run: fvm install

      - name: Build Flutter Web UI
        run: make -C frontends/flutter build_web

      - uses: actions/cache/save@v6
        id: flutter-app-cache
        with:
          path: frontends/flutter/build/web
          key: flutter-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  build_tamagui_ui:
    name: Build Tamagui Web UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Cache Tamagui web build output
        uses: actions/cache@v6
        id: tamagui-build-cache
        with:
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          key: tamagui-web-build-${{ runner.os }}-${{ hashFiles('frontends/tamagui/**', 'protos/**') }}

      - uses: actions/setup-node@v7
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22.x

      - run: npm install --global yarn
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'

      - name: Get yarn cache directory path
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        working-directory: frontends/tamagui
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        # id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: rellm-tamagui-build-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            rellm-tamagui-build-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn install
      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn version:install
      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn tsc
      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn web:prod:build

      - uses: actions/cache/save@v6
        id: web-app-cache
        with:
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          key: web-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  build_elm_ui:
    name: Test & Build Elm SPA Web UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Cache Elm packages
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: rellm-elm-build-${{ runner.os }}-${{ hashFiles('frontends/elm-spa/elm.json') }}
          restore-keys: |
            rellm-elm-build-${{ runner.os }}-

      - run: npm install --global elm elm-spa

      - working-directory: frontends/elm-spa
        run: make test

      - working-directory: frontends/elm-spa
        run: make build

      - uses: actions/cache/save@v6
        id: elm-app-cache
        with:
          path: frontends/elm-spa/public
          key: elm-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  build_rust_binaries:
    name: Build Rust Binaries
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-github-build
          shared-key: rellm-build-${{ runner.OS }}-github-build
          cache-workspace-crates: true

      - working-directory: backend
        run: cargo build --release

      - uses: actions/cache/save@v6
        id: rust-app-cache
        with:
          path: backend/target/release
          key: rust-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  build_rust_binaries_macos:
    name: Build Rust Binaries (macOS arm64)
    runs-on: macos-14
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-osx-aarch_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      # diesel's "postgres" feature links libpq at build time; Homebrew's libpq is
      # keg-only (not symlinked into /opt/homebrew), so point pq-sys/pkg-config at it.
      - name: Install libpq (Homebrew)
        run: |
          brew install libpq
          echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-arm64-github-build
          shared-key: rellm-build-${{ runner.OS }}-arm64-github-build
          cache-workspace-crates: true

      - working-directory: backend
        run: cargo build --release

      - uses: actions/cache/save@v6
        id: rust-macos-app-cache
        with:
          path: backend/target/release
          key: rust-macos-arm64-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  build_rust_binaries_linux_amd64_static:
    name: Build Rust Binaries (Linux amd64, static libpq)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-amd64-static-github-build
          shared-key: rellm-build-${{ runner.OS }}-amd64-static-github-build
          cache-workspace-crates: true

      # `static_pq` vendors & statically compiles libpq (via pq-sys's "bundled"
      # feature -> pq-src), so the resulting binary doesn't depend on a system
      # libpq install -- needed since the Linux release tarball (unlike the
      # server Docker image, which apt-get installs libpq5 itself) can be
      # extracted onto an arbitrary Linux machine.
      - working-directory: backend
        run: cargo build --release --features static_pq

      - uses: actions/cache/save@v6
        id: rust-linux-amd64-static-app-cache
        with:
          path: backend/target/release
          key: rust-linux-amd64-static-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  build_rust_binaries_linux_arm64_static:
    name: Build Rust Binaries (Linux arm64, static libpq)
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-aarch_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-arm64-static-github-build
          shared-key: rellm-build-${{ runner.OS }}-arm64-static-github-build
          cache-workspace-crates: true

      - working-directory: backend
        run: cargo build --release --features static_pq

      - uses: actions/cache/save@v6
        id: rust-linux-arm64-static-app-cache
        with:
          path: backend/target/release
          key: rust-linux-arm64-static-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}

  test_rust_binaries:
    name: Test Rust Binaries
    runs-on: ubuntu-latest
    # Backs the DB-backed specs under backend/src/tests/ (see src/tests/factories.rs), which run
    # against TEST_DATABASE_URL - a dedicated `rellm_test` DB, analogous to a Rails dev/test
    # split, kept separate from the `rellm_dev` DB used by a real running server. Migrations are
    # applied automatically on first test run, so no separate migration step is needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rellm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/rellm_test
      CARGO_INCREMENTAL: "0"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_REGION: ""
      MINIO_BUCKET: rellm-test
      MINIO_ACCESS_KEY: ROOTNAME
      MINIO_SECRET_KEY: CHANGEME123
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      # backend/src/tests/factories.rs's `test_bucket()` needs a real MinIO bucket (the
      # delete_media/delete_user specs verify actual object deletion, and rust-s3's async
      # client isn't mockable). GitHub Actions' `services:` containers can't override the
      # image's command, so it's started by hand here instead -- mirrors `backend/Makefile`'s
      # `local_minio_create` target.
      #
      # Image: bitnamilegacy/minio, not minio/minio or quay.io/minio/minio -- MinIO pulled
      # `minio/minio` from Docker Hub entirely (404s now), and as of 2026-09-24 also locked
      # down anonymous pulls of quay.io/minio/minio (valid token, no pull scope -> 401
      # "unauthorized" on every tag, pinned ones included) after archiving the OSS project.
      # bitnamilegacy/minio is Bitnami's frozen/unsupported-but-still-pullable image; it uses
      # its own entrypoint that starts the server itself, so no `server /data` command
      # override here (that bypasses Bitnami's setup script entirely).
      - name: Start MinIO
        run: |
          docker run -d -p 9000:9000 --name rellm-test-minio \
            -e "MINIO_ROOT_USER=${MINIO_ACCESS_KEY}" -e "MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}" \
            bitnamilegacy/minio:latest
          for i in $(seq 1 30); do
            if curl -sf "${MINIO_ENDPOINT}/minio/health/live" >/dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become healthy in time" >&2
          docker logs rellm-test-minio
          exit 1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-test-${{ runner.OS }}-github-test
          shared-key: rellm-test-${{ runner.OS }}-github-test
          cache-workspace-crates: true
      - working-directory: backend
        run: cargo test
      - working-directory: backend
        run: cargo build

  test_tamagui_ui:
    name: Test Tamagui Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Tamagui test result
        uses: actions/cache@v6
        id: tamagui-test-cache
        with:
          path: frontends/tamagui/.test-passed
          key: tamagui-web-test-${{ runner.os }}-${{ hashFiles('frontends/tamagui/**', 'protos/**') }}

      - uses: actions/setup-node@v7
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22.x
      - run: npm install --global yarn
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'

      - name: Get yarn cache directory path
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        working-directory: frontends/tamagui
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        # id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: rellm-tamagui-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            rellm-tamagui-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn install
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn version:install
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn build
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn tsc
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn test

      - name: Mark Tamagui tests passed
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: touch frontends/tamagui/.test-passed

  test_flutter_ui:
    name: Test Flutter Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
