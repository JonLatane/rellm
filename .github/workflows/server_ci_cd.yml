# Deploy steps APPLY the checked-in manifests for what CI manages -- each central-storage namespace's
# server, jobs and preview generator, the cluster's embedding service and each namespace's optional
# vector service -- at the freshly built image tag (.github/workflows/scripts/apply_backend_manifests.sh).
# That script only updates Deployments that already exist, never touches credentials Secrets, doesn't
# prune, and never writes `replicas` (server-side apply with the field stripped), so a stopped or
# scaled-down site stays that way. Manifests CI doesn't apply (namespaces with their own
# Postgres/object storage, central storage's Postgres/object storage, ingress) are still rolled out
# deliberately (see "Rolling out manifest changes" in deploys/README.md); the manifest_change_notice
# job flags pushes that need it.
name: Server CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: "DockerHub username for CD"
        required: true
      DOCKERHUB_TOKEN:
        description: "DockerHub access token for CD"
        required: true
      DIGITALOCEAN_ACCESS_TOKEN:
        description: "DigitalOcean access token for CD"
        required: true
      CLOUDFLARE_TOKEN:
        description: "Cloudflare API token for CD"
        required: true
      CLOUDFLARE_ZONE_JONLINEIO:
        description: "Cloudflare Zone ID for Jonline.io"
        required: true
      CLOUDFLARE_ZONE_BULLCITY_SOCIAL:
        description: "Cloudflare Zone ID for Bull City Social"
        required: true
      CLOUDFLARE_ZONE_OAKCITY_SOCIAL:
        description: "Cloudflare Zone ID for Oak City Social"
        required: true
      CLOUDFLARE_ZONE_ATO_BAND:
        description: "Cloudflare Zone ID for Ato Band"
        required: true
      CLOUDFLARE_ZONE_RELLM_ORG:
        description: "Cloudflare Zone ID for Rellm.org"
        required: true
      HOMEBREW_TAP_TOKEN:
        description: "GitHub PAT with contents:write on JonLatane/homebrew-rellm, used to push Formula updates"
        required: true

# Least privilege for GITHUB_TOKEN; the release jobs below opt in to `contents: write`.
permissions:
  contents: read

jobs:
  test_consistency:
    name: Test Proto/Docs Consistency
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: |
          PROTOC_VERSION=29.6
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version
      # - name: Install Graphviz
      #   run: sudo apt-get update && sudo apt-get install -y graphviz
      # - uses: subosito/flutter-action@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - run: npm install --global yarn

      - name: Get yarn cache directory path
        working-directory: frontends/tamagui
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        # id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: rellm-consistency-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            rellm-consistency-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - working-directory: frontends/tamagui
        run: yarn install
      - working-directory: frontends/tamagui
        run: yarn version:install

      - name: Build Markdown & HTML docs
        # run: make documentation html_docs
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: make documentation html_docs

      # TODO: GraphViz versions produce different diagram outputs.
      # My local Homebrew version is 9.0.0 (20230911.1827),
      # GitHub Actions is 2.43.0 (0)
      # - name: Build Graphviz diagrams
      #   run: make graphs

      - name: Install protoc-gen-elm
        run: yarn global add protoc-gen-elm

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - name: Cache pinned Flutter SDK (FVM)
        uses: actions/cache@v6
        with:
          path: ~/fvm/versions
          key: fvm-flutter-${{ hashFiles('frontends/flutter/.fvmrc') }}

      - working-directory: frontends/flutter
        run: fvm install

      - name: Build Protos
        run: make protos

      - name: Check for changes
        run: git diff --exit-code --ignore-matching-lines='//   protoc +v[\\.0-9]+' --ignore-matching-lines='- `protoc` [0-9]'

  test_deploys:
    name: Test Deploy Scripts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # No cluster needed: the tests run the deploys/ Makefiles and scripts against stub kubectl/tmux.
      - run: make -C deploys test

  build_flutter_ui:
    name: Build Flutter Web UI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      # frontends/flutter is frozen and pinned via FVM (see frontends/flutter/.fvmrc
      # and frontends/flutter/README.md) rather than tracking the `stable` channel,
      # so it's set up here instead of via subosito/flutter-action.
      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - name: Cache pinned Flutter SDK (FVM)
        uses: actions/cache@v6
        with:
          path: ~/fvm/versions
          key: fvm-flutter-${{ hashFiles('frontends/flutter/.fvmrc') }}

      - working-directory: frontends/flutter
        run: fvm install

      - name: Build Flutter Web UI
        run: make -C frontends/flutter build_web

      - name: Upload Flutter web build
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web-build
          path: frontends/flutter/build/web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build_tamagui_ui:
    name: Build Tamagui Web UI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Cache Tamagui web build output
        uses: actions/cache@v6
        id: tamagui-build-cache
        with:
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          key: tamagui-web-build-${{ runner.os }}-${{ hashFiles('frontends/tamagui/**', 'protos/**') }}

      - uses: actions/setup-node@v7
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22.x

      - run: npm install --global yarn
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'

      - name: Get yarn cache directory path
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        working-directory: frontends/tamagui
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        # id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: rellm-tamagui-build-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            rellm-tamagui-build-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn install
      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn version:install
      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn tsc
      - working-directory: frontends/tamagui
        if: steps.tamagui-build-cache.outputs.cache-hit != 'true'
        run: yarn web:prod:build

      - name: Upload tamagui-web-build
        uses: actions/upload-artifact@v7
        with:
          name: tamagui-web-build
          path: |
            frontends/tamagui/apps/next/out
            frontends/tamagui/apps/next/out-tamagui
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build_elm_ui:
    name: Test & Build Elm SPA Web UI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Cache Elm packages
        uses: actions/cache@v6
        with:
          path: ~/.elm
          key: rellm-elm-build-${{ runner.os }}-${{ hashFiles('frontends/elm-spa/elm.json') }}
          restore-keys: |
            rellm-elm-build-${{ runner.os }}-

      # Elm, elm-spa, elm-test-rs and elm-review are pinned in package.json/package-lock.json so CI
      # can't drift onto a newer Elm than elm.json declares.
      - working-directory: frontends/elm-spa
        run: npm ci

      - working-directory: frontends/elm-spa
        run: make test

      - working-directory: frontends/elm-spa
        run: make build

      - name: Upload elm-web-build
        uses: actions/upload-artifact@v7
        with:
          name: elm-web-build
          path: frontends/elm-spa/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build_rust_binaries:
    name: Build Rust Binaries
    runs-on: ubuntu-26.04
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-github-build
          shared-key: rellm-build-${{ runner.OS }}-github-build
          cache-workspace-crates: true

      # Default features only: no embedding model, ONNX Runtime or USearch code goes into the server or job
      # binaries (see build_embeddings_binaries for the separate rellm_embeddings image).
      - working-directory: backend
        run: cargo build --release

      - name: Pack Rust binaries (tar keeps the executable bits)
        run: |
          cd backend/target/release
          tar -cf "$RUNNER_TEMP/rust-binaries.tar" $(find . -maxdepth 1 -type f -perm -u+x ! -name '*.*' | sed 's|^\./||')
      - name: Upload rust-binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-binaries
          path: ${{ runner.temp }}/rust-binaries.tar
          if-no-files-found: error
          retention-days: 1

  # The rellm_embeddings image's two binaries (the cluster's embedding model service, which is the ONLY code that
  # loads a model, and the per-namespace vector search service). Built separately, with their cargo features, so
  # nothing model-related is ever linked into the server or jobs.
  build_embeddings_binaries:
    name: Build Embeddings Binaries
    runs-on: ubuntu-26.04
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-github-build-embeddings
          shared-key: rellm-build-${{ runner.OS }}-github-build-embeddings
          cache-workspace-crates: true

      - working-directory: backend
        run: cargo build --release --features embedding-service,vector-service --bin embedding_service --bin vector_search_service

      - name: Collect binaries
        run: |
          mkdir -p embeddings-binaries
          cp backend/target/release/embedding_service backend/target/release/vector_search_service embeddings-binaries/
      - uses: actions/cache/save@v6
        with:
          path: embeddings-binaries
          key: rust-embeddings-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}-${{ github.run_id }}

  build_rust_binaries_macos:
    name: Build Rust Binaries (macOS arm64)
    runs-on: macos-26
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-osx-aarch_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      # diesel's "postgres" feature links libpq at build time; Homebrew's libpq is
      # keg-only (not symlinked into /opt/homebrew), so point pq-sys/pkg-config at it.
      - name: Install libpq (Homebrew)
        run: |
          brew install libpq
          echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-arm64-github-build
          shared-key: rellm-build-${{ runner.OS }}-arm64-github-build
          cache-workspace-crates: true

      - working-directory: backend
        run: cargo build --release

      - name: Pack Rust binaries (tar keeps the executable bits)
        run: |
          cd backend/target/release
          tar -cf "$RUNNER_TEMP/rust-macos-arm64-binaries.tar" $(find . -maxdepth 1 -type f -perm -u+x ! -name '*.*' | sed 's|^\./||')
      - name: Upload rust-macos-arm64-binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-macos-arm64-binaries
          path: ${{ runner.temp }}/rust-macos-arm64-binaries.tar
          if-no-files-found: error
          retention-days: 1

  build_rust_binaries_linux_amd64_static:
    name: Build Rust Binaries (Linux amd64, static libpq)
    runs-on: ubuntu-26.04
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-amd64-static-github-build
          shared-key: rellm-build-${{ runner.OS }}-amd64-static-github-build
          cache-workspace-crates: true

      # `static_pq` vendors & statically compiles libpq (via pq-sys's "bundled"
      # feature -> pq-src), so the resulting binary doesn't depend on a system
      # libpq install -- needed since the Linux release tarball (unlike the
      # server Docker image, which apt-get installs libpq5 itself) can be
      # extracted onto an arbitrary Linux machine.
      - working-directory: backend
        run: cargo build --release --features static_pq

      - name: Pack Rust binaries (tar keeps the executable bits)
        run: |
          cd backend/target/release
          tar -cf "$RUNNER_TEMP/rust-linux-amd64-static-binaries.tar" $(find . -maxdepth 1 -type f -perm -u+x ! -name '*.*' | sed 's|^\./||')
      - name: Upload rust-linux-amd64-static-binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-linux-amd64-static-binaries
          path: ${{ runner.temp }}/rust-linux-amd64-static-binaries.tar
          if-no-files-found: error
          retention-days: 1

  build_rust_binaries_linux_arm64_static:
    name: Build Rust Binaries (Linux arm64, static libpq)
    runs-on: ubuntu-26.04-arm
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-aarch_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-build-${{ runner.OS }}-arm64-static-github-build
          shared-key: rellm-build-${{ runner.OS }}-arm64-static-github-build
          cache-workspace-crates: true

      - working-directory: backend
        run: cargo build --release --features static_pq

      - name: Pack Rust binaries (tar keeps the executable bits)
        run: |
          cd backend/target/release
          tar -cf "$RUNNER_TEMP/rust-linux-arm64-static-binaries.tar" $(find . -maxdepth 1 -type f -perm -u+x ! -name '*.*' | sed 's|^\./||')
      - name: Upload rust-linux-arm64-static-binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-linux-arm64-static-binaries
          path: ${{ runner.temp }}/rust-linux-arm64-static-binaries.tar
          if-no-files-found: error
          retention-days: 1

  test_rust_binaries:
    name: Test Rust Binaries
    runs-on: ubuntu-26.04
    # Backs the DB-backed specs under backend/src/tests/ (see src/tests/factories.rs), which run
    # against TEST_DATABASE_URL - a dedicated `rellm_test` DB, analogous to a Rails dev/test
    # split, kept separate from the `rellm_dev` DB used by a real running server. Migrations are
    # applied automatically on first test run, so no separate migration step is needed here.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: rellm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/rellm_test
      CARGO_INCREMENTAL: "0"
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: ""
      OBJECT_STORAGE_BUCKET: rellm-test
      OBJECT_STORAGE_ACCESS_KEY: ROOTNAME
      OBJECT_STORAGE_SECRET_KEY: CHANGEME123
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          PROTOC_VERSION=26.1
          PROTOC_ZIP=protoc-${PROTOC_VERSION}-linux-x86_64.zip
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"
          sudo unzip -o "$PROTOC_ZIP" -d /usr/local bin/protoc 'include/*'
          rm "$PROTOC_ZIP"
          protoc --version

      # backend/src/tests/factories.rs's `test_bucket()` needs a real object storage bucket
      # (the delete_media/delete_user specs verify actual object deletion, and rust-s3's async
      # client isn't mockable). GitHub Actions' `services:` containers can't override the
      # image's command, so it's started by hand here instead -- mirrors `backend/Makefile`'s
      # `local_object_storage_create` target.
      #
      # Image: pgsty/silo, not quay.io/minio/minio -- MinIO's OSS project was archived in
      # 2026 (GitHub repo archived, community web console stripped, no more prebuilt
      # community images), and quay.io/minio/minio now 401s "unauthorized" on anonymous pulls
      # of every tag, pinned ones included. pgsty/silo is a drop-in, MinIO-API-compatible fork
      # that accepts the exact same `server /data` invocation and MINIO_ROOT_USER/
      # MINIO_ROOT_PASSWORD env vars the old image did.
      - name: Start Object Storage
        run: |
          docker run -d -p 9000:9000 --name rellm-test-object-storage \
            -e "MINIO_ROOT_USER=${OBJECT_STORAGE_ACCESS_KEY}" -e "MINIO_ROOT_PASSWORD=${OBJECT_STORAGE_SECRET_KEY}" \
            pgsty/silo:latest server /data
          for i in $(seq 1 30); do
            if curl -sf "${OBJECT_STORAGE_ENDPOINT}/minio/health/live" >/dev/null; then
              echo "Object storage is up"
              exit 0
            fi
            sleep 1
          done
          echo "Object storage failed to become healthy in time" >&2
          docker logs rellm-test-object-storage
          exit 1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend -> target
          key: rellm-test-${{ runner.OS }}-github-test
          shared-key: rellm-test-${{ runner.OS }}-github-test
          cache-workspace-crates: true
      - working-directory: backend
        run: cargo test
      # The rellm_embeddings services (model service, USearch vector service) are behind cargo features.
      - working-directory: backend
        run: cargo test --features embedding-service,vector-service -- embeddings_tests vector_service_tests
      - working-directory: backend
        run: cargo build

  test_tamagui_ui:
    name: Test Tamagui Web UI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Tamagui test result
        uses: actions/cache@v6
        id: tamagui-test-cache
        with:
          path: frontends/tamagui/.test-passed
          key: tamagui-web-test-${{ runner.os }}-${{ hashFiles('frontends/tamagui/**', 'protos/**') }}

      - uses: actions/setup-node@v7
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22.x
      - run: npm install --global yarn
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'

      - name: Get yarn cache directory path
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        working-directory: frontends/tamagui
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v6
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        # id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: rellm-tamagui-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            rellm-tamagui-test-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn install
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn version:install
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn build
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn tsc
      - working-directory: frontends/tamagui
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: yarn test

      - name: Mark Tamagui tests passed
        if: steps.tamagui-test-cache.outputs.cache-hit != 'true'
        run: touch frontends/tamagui/.test-passed

  test_flutter_ui:
    name: Test Flutter Web UI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - name: Cache pinned Flutter SDK (FVM)
        uses: actions/cache@v6
        with:
          path: ~/fvm/versions
          key: fvm-flutter-${{ hashFiles('frontends/flutter/.fvmrc') }}

      - working-directory: frontends/flutter
        run: fvm install

      - name: Test Flutter Web UI
        run: make -C frontends/flutter test

  push_server:
    name: "DockerHub: Server"
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experiments/elm-spa'
    runs-on: ubuntu-26.04
    needs:
      - build_flutter_ui
      - build_tamagui_ui
      - build_elm_ui
      - build_rust_binaries
      - test_consistency

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Download Flutter web build
        uses: actions/download-artifact@v7
        with:
          name: flutter-web-build
          path: frontends/flutter/build/web
      - name: Download tamagui-web-build
        uses: actions/download-artifact@v7
        with:
          name: tamagui-web-build
          # The artifact holds `out` and `out-tamagui`, rooted at their common parent.
          path: frontends/tamagui/apps/next
      - name: Download elm-web-build
        uses: actions/download-artifact@v7
        with:
          name: elm-web-build
          path: frontends/elm-spa/public
      - name: Download rust-binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-binaries
          path: ${{ runner.temp }}/rust-binaries
      - name: Unpack Rust binaries
        run: |
          mkdir -p backend/target/release
          tar -xf "$RUNNER_TEMP/rust-binaries/rust-binaries.tar" -C backend/target/release

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rename Rust binaries for Dockerfiles
        run: >-
          mv backend/target/release/rellm backend/target/release/rellm__server_release &&
          mv backend/target/release/disable_cdn_grpc backend/target/release/disable_cdn_grpc__server_release &&
          mv backend/target/release/delete_expired_tokens backend/target/release/delete_expired_tokens__server_release &&
          mv backend/target/release/delete_unowned_media backend/target/release/delete_unowned_media__server_release &&
          mv backend/target/release/sync_sources backend/target/release/sync_sources__server_release &&
          mv backend/target/release/update_user_counts backend/target/release/update_user_counts__server_release &&
          mv backend/target/release/generate_embeddings backend/target/release/generate_embeddings__server_release &&
          mv backend/target/release/convert_media_sizes backend/target/release/convert_media_sizes__server_release &&
          mv backend/target/release/renew_market_subscriptions backend/target/release/renew_market_subscriptions__server_release &&
          mv backend/target/release/generate_link_preview_images backend/target/release/generate_link_preview_images__server_release &&
          mv backend/target/release/delete_link_preview_images backend/target/release/delete_link_preview_images__server_release &&
          mv backend/target/release/calculate_server_media_usage backend/target/release/calculate_server_media_usage__server_release &&
          mv backend/target/release/calculate_server_object_storage_usage backend/target/release/calculate_server_object_storage_usage__server_release &&
          mv backend/target/release/set_permission backend/target/release/set_permission__server_release &&
          mv backend/target/release/free_all_cluster_resources backend/target/release/free_all_cluster_resources__server_release &&
          mv backend/target/release/to_db_id backend/target/release/to_db_id__server_release &&
          mv backend/target/release/to_proto_id backend/target/release/to_proto_id__server_release &&
          mv backend/target/release/repair_email_messages backend/target/release/repair_email_messages__server_release &&
          mv backend/target/release/fix_duplicate_synced_events backend/target/release/fix_duplicate_synced_events__server_release &&
          mv backend/target/release/reencode_quicktime_media backend/target/release/reencode_quicktime_media__server_release &&
          mv backend/target/release/reconvert_audio_media backend/target/release/reconvert_audio_media__server_release

      - name: Build and push rellm image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rellm:${{ steps.vars.outputs.be_version }},${{ secrets.DOCKERHUB_USERNAME }}/rellm:${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
          context: .
          file: ./deploys/docker/server/Dockerfile
          platforms: linux/amd64

  push_preview_generator:
    name: "DockerHub: Preview Generator"
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experiments/elm-spa'
    runs-on: ubuntu-26.04
    needs:
      - build_rust_binaries
      - test_consistency

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Download rust-binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-binaries
          path: ${{ runner.temp }}/rust-binaries
      - name: Unpack Rust binaries
        run: |
          mkdir -p backend/target/release
          tar -xf "$RUNNER_TEMP/rust-binaries/rust-binaries.tar" -C backend/target/release

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rename Rust binaries for Dockerfiles
        run: >-
          mv backend/target/release/rellm backend/target/release/rellm__server_release &&
          mv backend/target/release/disable_cdn_grpc backend/target/release/disable_cdn_grpc__server_release &&
          mv backend/target/release/delete_expired_tokens backend/target/release/delete_expired_tokens__server_release &&
          mv backend/target/release/delete_unowned_media backend/target/release/delete_unowned_media__server_release &&
          mv backend/target/release/generate_link_preview_images backend/target/release/generate_link_preview_images__server_release &&
          mv backend/target/release/delete_link_preview_images backend/target/release/delete_link_preview_images__server_release &&
          mv backend/target/release/regenerate_link_preview_images_for_post backend/target/release/regenerate_link_preview_images_for_post__server_release &&
          mv backend/target/release/set_permission backend/target/release/set_permission__server_release

      - name: Build and push rellm_preview_generator image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rellm_preview_generator:${{ steps.vars.outputs.be_version }},${{ secrets.DOCKERHUB_USERNAME }}/rellm_preview_generator:${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
          context: .
          file: ./deploys/docker/preview_generator/Dockerfile
          platforms: linux/amd64

  push_embeddings:
    name: "DockerHub: Embeddings (model + vector services)"
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experiments/elm-spa'
    runs-on: ubuntu-26.04
    needs:
      - build_embeddings_binaries
      - test_rust_binaries

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v6
        with:
          path: embeddings-binaries
          key: rust-embeddings-${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push rellm_embeddings image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rellm_embeddings:${{ steps.vars.outputs.be_version }},${{ secrets.DOCKERHUB_USERNAME }}/rellm_embeddings:${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}
          context: .
          file: ./deploys/docker/embeddings/Dockerfile
          platforms: linux/amd64

  # The cluster's ONE embedding model service (rellm-storage/rellm-central-embedding); skipped (not failed)
  # when the cluster hasn't set it up. Its manifest does a surge rollout (new pod Ready before the old one
  # stops), so semantic search has no gap. Not a gate for the release/namespace deploys: an embedding
  # rollout problem shows up as this job failing without holding up the sites.
  deploy_central_embedding:
    name: Deploy Central Embedding Service
    if: github.ref == 'refs/heads/main'
    needs:
      - test_deploys
      - test_rust_binaries
      - push_embeddings
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      - name: Deploy Embedding Service (apply manifests)
        run: .github/workflows/scripts/apply_backend_manifests.sh embedding rellm-storage "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

      # The first start of a new pod may re-download the model if the PVC was recreated (~300MB).
      - name: Verify Embedding deployment
        run: |
          [ -n "$(kubectl get deployment rellm-central-embedding -n rellm-storage --ignore-not-found -o name)" ] || { echo "Not deployed on this cluster -- nothing to verify."; exit 0; }
          kubectl rollout status deployment/rellm-central-embedding -n rellm-storage --timeout 10m

  deploy_jonlineio_server:
    name: Deploy Jonline.io Server
    if: github.ref == 'refs/heads/main'
    needs:
      - test_deploys
      - test_rust_binaries
      - test_flutter_ui
      - test_tamagui_ui
      - push_server
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      # If you haven't already integrated with your registry and only want workloads in a particular namespace to be able to pull
      # from your registry, uncomment the next two commands.
      # - name: Upload credentials of your registry to your DigitalOcean Kubernetes cluster
      #   run: doctl registry kubernetes-manifest | kubectl apply -f -

      # - name: Reference the secret you just uploaded as an imagePullSecrets
      #   run: "kubectl patch serviceaccount default -p '{\"imagePullSecrets\": [{\"name\": \"registry-<your-registry-name>`\"}]}'"

      - name: Delete stray CronJobs (background jobs moved to the rellm-jobs Deployment)
        run: kubectl delete cronjob --all -n jonline --ignore-not-found=true

      - name: Deploy to Jonline.io via DigitalOcean Kubernetes (apply manifests)
        run: .github/workflows/scripts/apply_backend_manifests.sh server jonline "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Verify Server deployment
        run: kubectl rollout status deployment/rellm -n jonline --timeout 5m

      # Traefik's TLS-passthrough IngressRouteTCP routing (see rellm-https/rellm-grpc)
      # can get wedged pointing at stale backend pod IPs after a rollout replaces pods --
      # this refreshes it so jonline.io doesn't silently start 404ing/hanging post-deploy.
      - name: Bounce Traefik to refresh routing
        run: |
          kubectl rollout restart deployment traefik -n traefik-ingress
          kubectl rollout status deployment traefik -n traefik-ingress --timeout 5m

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_JONLINEIO }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: .github/workflows/scripts/purge_cloudflare_cache.sh jonline.io

  deploy_jonlineio_preview_generator:
    name: Deploy Jonline.io Preview Generator
    if: github.ref == 'refs/heads/main'
    needs:
      - test_deploys
      - test_rust_binaries
      - push_preview_generator
      - push_embeddings
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      - name: Deploy to Jonline.io via DigitalOcean Kubernetes
        run: .github/workflows/scripts/apply_backend_manifests.sh preview jonline "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Deploy Vector Search Service, if this namespace has one (apply manifests)
        run: .github/workflows/scripts/apply_backend_manifests.sh vector jonline "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

  create_github_release:
    name: "GitHub: Release"
    permissions:
      contents: write # pushes the version tag and creates the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs:
      - test_deploys
      - deploy_jonlineio_server
      - deploy_jonlineio_preview_generator
      - push_server
      - push_preview_generator
      - push_embeddings
      - test_consistency
      - test_rust_binaries
      - test_flutter_ui
      - test_tamagui_ui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Versioning Data
        id: vars
        run: |-
          be_version="$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/\"//g')"
          dated_sha_short="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "be_version=${be_version}" >> $GITHUB_OUTPUT
          echo "dated_sha_short=${dated_sha_short}" >> $GITHUB_OUTPUT
          echo "full_version=${be_version}-${dated_sha_short}" >> $GITHUB_OUTPUT

      - name: Store Versioning Data for release ${{ steps.vars.outputs.full_version }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Push tag v${{ steps.vars.outputs.full_version }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: "${{ steps.vars.outputs.full_version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Changelog
        id: changelog
        run: |
          delimiter="$(openssl rand -hex 32)"
          echo "ci_changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$(git --no-pager log -10 --pretty='- [`%h` / *%ch*] %B')" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
      - name: Display Changelog (for debugging the CI/CD process)
        env:
          # Piped through an env var (rather than interpolated directly into the script below)
          # because commit messages routinely contain backticks/`$()`/parens for Markdown code
          # formatting -- inlining `${{ }}` straight into a run: script splices that text into the
          # shell source itself, so bash tries to execute every backtick-quoted identifier as a
          # command substitution. Referencing it as "$CI_CHANGELOG" instead treats it as inert data.
          CI_CHANGELOG: ${{ steps.changelog.outputs.ci_changelog }}
        run: |
          printf 'The string is: \n%s\n' "$CI_CHANGELOG"

      - name: Create release v${{ steps.vars.outputs.full_version }}
        uses: ncipollo/release-action@v1
        with:
          name: "v${{ steps.vars.outputs.full_version }} (CI/CD)"
          tag: "v${{ steps.vars.outputs.full_version }}"
          makeLatest: true
          body: |-
            # Rellm CI/CD Release

            ### `v${{ steps.vars.outputs.full_version }}`

            Built by the [Server CI/CD GitHub Action ![Server CI/CD Badge](https://github.com/jonlatane/rellm/actions/workflows/server_ci_cd.yml/badge.svg)](https://github.com/jonlatane/rellm/actions/workflows/server_ci_cd.yml).

            Images are available on DockerHub:

            - [DockerHub: Rellm Server (jonlatane/rellm:${{ steps.vars.outputs.full_version }})](https://hub.docker.com/r/jonlatane/rellm/tags?page=1&name=${{ steps.vars.outputs.full_version }})

            - [DockerHub: Rellm Preview Generator (jonlatane/rellm_preview_generator:${{ steps.vars.outputs.full_version }})](https://hub.docker.com/r/jonlatane/rellm_preview_generator/tags?page=1&name=${{ steps.vars.outputs.full_version }})
            - [DockerHub: Rellm Embeddings (jonlatane/rellm_embeddings:${{ steps.vars.outputs.full_version }})](https://hub.docker.com/r/jonlatane/rellm_embeddings/tags?page=1&name=${{ steps.vars.outputs.full_version }})

            A macOS (Apple Silicon) build is available via Homebrew:

            ```
            brew install jonlatane/rellm/rellm
            ```

            A self-updating Linux build (amd64/arm64) is available as a release tarball:

            ```
            curl -s https://api.github.com/repos/jonlatane/rellm/releases/latest \
              | jq -r '.assets[] | select(.name | test("-linux\\.tar\\.bz2$")) | .browser_download_url' \
              | xargs curl -L -o rellm.tar.bz2
            mkdir rellm && tar xjf rellm.tar.bz2 -C rellm && rm rellm.tar.bz2
            cd rellm
            ./bin/rellm version
            ```

            Run `./bin/rellm help` for other commands, including `update` to self-update in place.

            ## Deployments

            Deployments will be brought up-to-date at around the same time as this release is created.

            First, Jonline.io (and any other "development" deployments) will be updated.

            Then, this release is created (so, Jonline.io should already be updated).

            Finally, Rellm.org, Bull City Social, and Oak City Social (and any other "production" deployments) will be updated.

            | Deployment | Links | Deployment Version |
            | --- | --- | --- |
            | [Rellm.org ![Rellm.org](https://rellm.org/info_shield?56fdas586)](https://rellm.org/)     | [About](https://rellm.org/about), [Protocol Docs](https://rellm.org/docs/protocol/)   | Production  |
            | [OakCity.Social ![OakCity.Social](https://OakCity.Social/info_shield?56fdas586)](https://OakCity.Social/)     | [About](https://OakCity.Social/about), [Protocol Docs](https://OakCity.Social/docs/protocol/)   | Production  |
            | [BullCity.Social ![BullCity.Social](https://BullCity.Social/info_shield?56fdas586)](https://BullCity.Social/) | [About](https://BullCity.Social/about), [Protocol Docs](https://BullCity.Social/docs/protocol/) | Production  |
            | [ATO.Band ![ATO.Band](https://ATO.Band/info_shield?56fdas586)](https://ATO.Band/)     | [About](https://OakCity.Social/about), [Protocol Docs](https://OakCity.Social/docs/protocol/)   | Production  |
            | [Jonline.io ![Jonline.io](https://jonline.io/info_shield?56fdas586)](https://jonline.io)                      | [About](https://jonline.io/about), [Protocol Docs](https://rellm.org/docs/protocol/)           | Development |

            ## Changelog

            This list's Markdown was generated with `git log -100 --pretty='- [%h / *%ch*] %B'` at release time:

            ${{ steps.changelog.outputs.ci_changelog }}

  create_homebrew_release:
    name: "Homebrew: Release"
    permissions:
      contents: write # `gh release upload` onto the release created above
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs:
      - create_github_release
      - build_rust_binaries_macos
      - build_flutter_ui
      - build_tamagui_ui
      - build_elm_ui
      - test_consistency

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          be_version="$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')"
          dated_sha_short="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "be_version=${be_version}" >> $GITHUB_OUTPUT
          echo "dated_sha_short=${dated_sha_short}" >> $GITHUB_OUTPUT
          echo "full_version=${be_version}-${dated_sha_short}" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.full_version }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Download tamagui-web-build
        uses: actions/download-artifact@v7
        with:
          name: tamagui-web-build
          # The artifact holds `out` and `out-tamagui`, rooted at their common parent.
          path: frontends/tamagui/apps/next
      - name: Download elm-web-build
        uses: actions/download-artifact@v7
        with:
          name: elm-web-build
          path: frontends/elm-spa/public
      - name: Download Flutter web build
        uses: actions/download-artifact@v7
        with:
          name: flutter-web-build
          path: frontends/flutter/build/web
      - name: Download rust-macos-arm64-binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-macos-arm64-binaries
          path: ${{ runner.temp }}/rust-macos-arm64-binaries
      - name: Unpack Rust binaries
        run: |
          mkdir -p backend/target/release
          tar -xf "$RUNNER_TEMP/rust-macos-arm64-binaries/rust-macos-arm64-binaries.tar" -C backend/target/release

      # Mirrors deploys/docker/server/Dockerfile's /opt layout, but rooted at a
      # staging dir that becomes the formula's libexec (/opt/homebrew/opt/rellm/libexec) on the installed Mac.
      - name: Assemble /opt/homebrew/etc/rellm package layout
        run: |
          set -euo pipefail
          PKG=rellm_pkg
          rm -rf "$PKG"
          mkdir -p "$PKG"

          for bin in rellm disable_cdn_grpc delete_expired_tokens delete_unowned_media \
                     sync_sources update_user_counts generate_embeddings convert_media_sizes renew_market_subscriptions generate_link_preview_images regenerate_link_preview_images_for_post delete_link_preview_images \
                     calculate_server_media_usage calculate_server_object_storage_usage \
                     set_permission free_all_cluster_resources to_db_id to_proto_id; do
            cp "backend/target/release/${bin}" "$PKG/${bin}"
            chmod +x "$PKG/${bin}"
          done

          cp backend/background_jobs.sh "$PKG/background_jobs.sh"
          chmod +x "$PKG/background_jobs.sh"

          mv "$PKG/rellm" "$PKG/rellm-server"

          # backend/src/web/*.rs read frontend/doc assets via CWD-relative
          # "opt/..." paths (mirroring deploys/docker/server/Dockerfile, which
          # COPYs to /opt/... and runs with CWD "/") -- docs/rellm_homebrew.sh
          # cd's into this package dir before exec'ing the server, so those
          # assets need to live under an "opt/" subdir here too, not the
          # package root.
          mkdir -p "$PKG/opt/docs" "$PKG/opt/tamagui_web" "$PKG/opt/tamagui_web_tamagui" "$PKG/opt/elm_web" "$PKG/opt/flutter_web" "$PKG/opt/deploys"
          cp deploys/docker/continuous_delivery_hash "$PKG/opt/continuous_delivery_hash"
          cp docs/protocol.html "$PKG/opt/docs/protocol.html"
          cp -R frontends/tamagui/apps/next/out/. "$PKG/opt/tamagui_web/"
          cp -R frontends/tamagui/apps/next/out-tamagui/. "$PKG/opt/tamagui_web_tamagui/"
          cp -R frontends/elm-spa/public/. "$PKG/opt/elm_web/"
          cp -R frontends/flutter/build/web/. "$PKG/opt/flutter_web/"

          # Bundled so `rellm deploy <targets...>` (docs/rellm_homebrew.sh) can run these
          # Makefile targets against your own K8s cluster -- see deploys/distributables.sh.
          # Checkout is fresh here, so this can't pick up gitignored local state (generated_certs'
          # private keys, deploys/backups' Postgres dumps, etc.) -- only what's actually tracked.
          cp -R deploys/. "$PKG/opt/deploys/"

          # grpcurl is useful to have on a rellm instance (see Dockerfile) --
          # osx_arm64 build, matching the version pinned there.
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_osx_arm64.tar.gz" | tar -xz -C "$PKG" grpcurl

          tar czf "rellm-${{ steps.vars.outputs.full_version }}-macos-arm64.tar.gz" -C "$PKG" .

      - name: Compute sha256
        id: sha
        run: echo "sha256=$(sha256sum rellm-${{ steps.vars.outputs.full_version }}-macos-arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload release asset to v${{ steps.vars.outputs.full_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.vars.outputs.full_version }}" "rellm-${{ steps.vars.outputs.full_version }}-macos-arm64.tar.gz" --repo jonlatane/rellm --clobber

      - name: Push Formula/rellm.rb to JonLatane/homebrew-rellm
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/JonLatane/homebrew-rellm.git" tap

          cat > tap/Formula/rellm.rb <<'RELLM_FORMULA_HEADER_EOF'
          # This file is generated and pushed automatically by the Server CI/CD workflow
          # (create_homebrew_release job) in https://github.com/jonlatane/rellm on every
          # release to main. Don't hand-edit it -- changes will be overwritten. The launcher
          # script below is sourced from docs/rellm_homebrew.sh in that repo.
          class Rellm < Formula
            desc "Rellm federated social server"
            homepage "https://github.com/jonlatane/rellm"
            url "https://github.com/jonlatane/rellm/releases/download/vFULL_VERSION_PLACEHOLDER/rellm-FULL_VERSION_PLACEHOLDER-macos-arm64.tar.gz"
            sha256 "SHA256_PLACEHOLDER"
            version "FULL_VERSION_PLACEHOLDER"
            license "AGPL-3.0-only"

            depends_on arch: :arm64
            depends_on "libpq"

            def install
              # libexec (a per-version Cellar dir), NOT etc: Homebrew never overwrites an
              # existing, differing file under etc -- it writes "<file>.default" beside it --
              # so installing the binaries there left every upgrade running the first
              # version's rellm-server (`rellm version` never changed).
              libexec.install Dir["*"]
              (bin/"rellm").write <<~SCRIPT
          RELLM_FORMULA_HEADER_EOF

          # docs/rellm_homebrew.sh is plain, standalone bash aside from the
          # @@RELLM_ETC@@/rellm placeholder, which becomes Ruby's `#{opt_libexec}` interpolation
          # here -- Homebrew resolves that to the real install prefix at `brew install`
          # time, so it can't be a fixed value baked in at CI time.
          # The package dir is `#{opt_libexec}` (stable across upgrades, unlike the versioned
          # Cellar path); the launcher's "@@RELLM_ETC@@/rellm" prefix becomes exactly that.
          sed -e 's|@@RELLM_ETC@@/rellm|#{opt_libexec}|g' -e 's/^/                /' docs/rellm_homebrew.sh >> tap/Formula/rellm.rb

          cat >> tap/Formula/rellm.rb <<'RELLM_FORMULA_FOOTER_EOF'
              SCRIPT
              chmod 0755, bin/"rellm"

              # bin/"rellm" implements `completion bash`/`completion zsh` (see
              # docs/rellm_homebrew.sh) as a positional arg, not a `--shell=`
              # flag, so shell_parameter_format is left at its nil default --
              # Homebrew's :arg format actually means `--shell=bash`, despite
              # the name. This runs `rellm completion bash`/`completion zsh`
              # to capture the scripts, which Homebrew installs into the
              # right completions dirs.
              generate_completions_from_executable(bin/"rellm", "completion", shells: [:bash, :zsh])
            end

            # `brew services start rellm` -- runs `rellm server_and_jobs`. The launcher
            # itself writes the merged, [server]/[jobs]-labeled output to
            # RELLM_LOG_FILE with size-based rotation and mirrors it to syslog (see
            # docs/rellm_homebrew.sh), so launchd's own log only catches launcher errors.
            # opt_bin (not bin) survives upgrades; std_service_path_env puts Homebrew's
            # bin on PATH for the jobs' optional ImageMagick/ffmpeg.
            service do
              run [opt_bin/"rellm", "server_and_jobs"]
              keep_alive true
              environment_variables PATH: std_service_path_env,
                                    RELLM_LOG_FILE: "#{var}/log/rellm.log",
                                    RELLM_SYSLOG: "1"
              log_path var/"log/rellm-service.log"
              error_log_path var/"log/rellm-service.log"
            end

            test do
              system "#{bin}/rellm", "version"
            end
          end
          RELLM_FORMULA_FOOTER_EOF

          sed -i "s|FULL_VERSION_PLACEHOLDER|${{ steps.vars.outputs.full_version }}|g" tap/Formula/rellm.rb
          sed -i "s|SHA256_PLACEHOLDER|${{ steps.sha.outputs.sha256 }}|g" tap/Formula/rellm.rb

          cd tap
          git -c user.name="Rellm CI" -c user.email="ci@jonline.io" add Formula/rellm.rb
          if git diff --cached --quiet; then
            echo "No Formula changes to push"
          else
            git -c user.name="Rellm CI" -c user.email="ci@jonline.io" commit -m "rellm ${{ steps.vars.outputs.full_version }}"
            git push origin main
          fi

  create_linux_release:
    name: "Linux: Release"
    permissions:
      contents: write # `gh release upload` onto the release created above
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs:
      - create_github_release
      - build_rust_binaries_linux_amd64_static
      - build_rust_binaries_linux_arm64_static
      - build_flutter_ui
      - build_tamagui_ui
      - build_elm_ui
      - test_consistency

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          be_version="$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')"
          dated_sha_short="$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)"
          echo "be_version=${be_version}" >> $GITHUB_OUTPUT
          echo "dated_sha_short=${dated_sha_short}" >> $GITHUB_OUTPUT
          echo "full_version=${be_version}-${dated_sha_short}" >> $GITHUB_OUTPUT
      - name: Store Versioning Data for release ${{ steps.vars.outputs.full_version }}
        run: echo ${{ steps.vars.outputs.dated_sha_short }} > deploys/docker/continuous_delivery_hash

      - name: Download tamagui-web-build
        uses: actions/download-artifact@v7
        with:
          name: tamagui-web-build
          # The artifact holds `out` and `out-tamagui`, rooted at their common parent.
          path: frontends/tamagui/apps/next
      - name: Download elm-web-build
        uses: actions/download-artifact@v7
        with:
          name: elm-web-build
          path: frontends/elm-spa/public
      - name: Download Flutter web build
        uses: actions/download-artifact@v7
        with:
          name: flutter-web-build
          path: frontends/flutter/build/web

      # Both cached builds were saved from the same "backend/target/release"
      # path, so they're restored one at a time and moved aside immediately --
      # restoring both to that path in one job would have the second clobber
      # the first.
      - name: Download rust-linux-amd64-static-binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-linux-amd64-static-binaries
          path: ${{ runner.temp }}/rust-linux-amd64-static-binaries
      - name: Unpack Rust binaries
        run: |
          mkdir -p backend/target/release
          tar -xf "$RUNNER_TEMP/rust-linux-amd64-static-binaries/rust-linux-amd64-static-binaries.tar" -C backend/target/release
      - run: mv backend/target/release backend/target/release-amd64

      - name: Download rust-linux-arm64-static-binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-linux-arm64-static-binaries
          path: ${{ runner.temp }}/rust-linux-arm64-static-binaries
      - name: Unpack Rust binaries
        run: |
          mkdir -p backend/target/release
          tar -xf "$RUNNER_TEMP/rust-linux-arm64-static-binaries/rust-linux-arm64-static-binaries.tar" -C backend/target/release
      - run: mv backend/target/release backend/target/release-arm64

      # Mirrors deploys/docker/server/Dockerfile's /opt layout (and the
      # Homebrew package layout above), but with binaries for every built
      # architecture side-by-side (arch-suffixed) instead of just one, since
      # this tarball can be extracted onto any Linux machine.
      - name: Assemble Linux release package layout
        run: |
          set -euo pipefail
          PKG=rellm_linux_pkg
          rm -rf "$PKG"
          mkdir -p "$PKG/bin"

          for arch in amd64 arm64; do
            src="backend/target/release-${arch}"
            for bin in rellm disable_cdn_grpc delete_expired_tokens delete_unowned_media \
                       sync_sources update_user_counts generate_embeddings convert_media_sizes renew_market_subscriptions generate_link_preview_images regenerate_link_preview_images_for_post delete_link_preview_images \
                       calculate_server_media_usage calculate_server_object_storage_usage \
                       set_permission free_all_cluster_resources to_db_id to_proto_id; do
              cp "${src}/${bin}" "$PKG/${bin}-${arch}"
              chmod +x "$PKG/${bin}-${arch}"
            done
            mv "$PKG/rellm-${arch}" "$PKG/rellm-server-${arch}"
          done

          cp backend/background_jobs.sh "$PKG/background_jobs.sh"
          chmod +x "$PKG/background_jobs.sh"

          echo "${{ steps.vars.outputs.full_version }}" > "$PKG/version"

          # backend/src/web/*.rs read frontend/doc assets via CWD-relative
          # "opt/..." paths (mirroring deploys/docker/server/Dockerfile, which
          # COPYs to /opt/... and runs with CWD "/") -- docs/rellm_linux.sh
          # cd's into this package dir before exec'ing the server, so those
          # assets need to live under an "opt/" subdir here too, not the
          # package root.
          mkdir -p "$PKG/opt/docs" "$PKG/opt/tamagui_web" "$PKG/opt/tamagui_web_tamagui" "$PKG/opt/elm_web" "$PKG/opt/flutter_web" "$PKG/opt/deploys"
          cp deploys/docker/continuous_delivery_hash "$PKG/opt/continuous_delivery_hash"
          cp docs/protocol.html "$PKG/opt/docs/protocol.html"
          cp -R frontends/tamagui/apps/next/out/. "$PKG/opt/tamagui_web/"
          cp -R frontends/tamagui/apps/next/out-tamagui/. "$PKG/opt/tamagui_web_tamagui/"
          cp -R frontends/elm-spa/public/. "$PKG/opt/elm_web/"
          cp -R frontends/flutter/build/web/. "$PKG/opt/flutter_web/"

          # Bundled so `rellm deploy <targets...>` (docs/rellm_linux.sh) can run these
          # Makefile targets against your own K8s cluster -- see deploys/distributables.sh.
          # Checkout is fresh here, so this can't pick up gitignored local state (generated_certs'
          # private keys, deploys/backups' Postgres dumps, etc.) -- only what's actually tracked.
          cp -R deploys/. "$PKG/opt/deploys/"

          # grpcurl is useful to have on a rellm instance (see Dockerfile) --
          # one per architecture, matching the version pinned there.
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_x86_64.tar.gz" | tar -xz -C "$PKG" grpcurl
          mv "$PKG/grpcurl" "$PKG/grpcurl-amd64"
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_arm64.tar.gz" | tar -xz -C "$PKG" grpcurl
          mv "$PKG/grpcurl" "$PKG/grpcurl-arm64"

          # docs/rellm_linux.sh is plain, standalone bash aside from the
          # @@RELLM_PACKAGE_BASE_DIR@@ placeholder -- unlike Homebrew's
          # @@RELLM_ETC@@ (Ruby-interpolated at `brew install` time), this
          # tarball can be extracted anywhere, so a concrete default install
          # dir is baked in here at CI time instead. It stays as unexpanded
          # shell syntax so it resolves against whichever user's $HOME
          # actually runs it.
          sed 's|@@RELLM_PACKAGE_BASE_DIR@@|$HOME/.rellm-linux|' docs/rellm_linux.sh > "$PKG/bin/rellm"
          chmod +x "$PKG/bin/rellm"

          tar cjf "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2" -C "$PKG" .

      - name: Compute sha256
        run: sha256sum "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2" > "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2.sha256"

      - name: Upload release assets to v${{ steps.vars.outputs.full_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.vars.outputs.full_version }}" \
            "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2" \
            "rellm-${{ steps.vars.outputs.full_version }}-linux.tar.bz2.sha256" \
            --repo jonlatane/rellm --clobber

  deploy_bullcitysocial:
    name: Deploy Bull City Social
    needs: create_github_release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract Versioning Data
        id: vars
        run: |-
          echo "be_version=$(cat backend/Cargo.toml | grep 'version =' | sed -n 1p | awk '{print $3;}' | sed 's/"//g')" >> $GITHUB_OUTPUT
          echo "dated_sha_short=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 rellm-be

      - name: Delete stray CronJobs (background jobs moved to the rellm-jobs Deployment)
        run: kubectl delete cronjob --all -n bullcitysocial --ignore-not-found=true

      - name: Deploy to Bull City Social via DigitalOcean Kubernetes (apply manifests)
        run: .github/workflows/scripts/apply_backend_manifests.sh server bullcitysocial "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Verify Server deployment
        run: kubectl rollout status deployment/rellm -n bullcitysocial --timeout 5m

      - name: Deploy Preview Generator (apply manifests)
        run: .github/workflows/scripts/apply_backend_manifests.sh preview bullcitysocial "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Deploy Vector Search Service, if this namespace has one (apply manifests)
        run: .github/workflows/scripts/apply_backend_manifests.sh vector bullcitysocial "${{ steps.vars.outputs.be_version }}-${{ steps.vars.outputs.dated_sha_short }}" "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_BULLCITY_SOCIAL }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: .github/workflows/scripts/purge_cloudflare_cache.sh bullcity.social

