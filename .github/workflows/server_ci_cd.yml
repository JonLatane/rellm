          mv backend/target/release/delete_expired_tokens backend/target/release/delete_expired_tokens__server_release &&
          mv backend/target/release/delete_unowned_media backend/target/release/delete_unowned_media__server_release &&
          mv backend/target/release/sync_sources backend/target/release/sync_sources__server_release &&
          mv backend/target/release/update_user_counts backend/target/release/update_user_counts__server_release &&
          mv backend/target/release/convert_media_sizes backend/target/release/convert_media_sizes__server_release &&
