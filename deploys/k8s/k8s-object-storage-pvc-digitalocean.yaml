# Split out from k8s-object-storage-digitalocean.yaml: a PVC's spec (other than
# resources.requests) is immutable once bound, so re-`apply`-ing it alongside the
# Service/StatefulSet on every update fails outright if the live PVC's storageClassName ever
# drifts from what's declared here (as happened when existing PVCs, provisioned on plain
# "do-block-storage" before the "-retain" StorageClass existed, got left bound rather than
# recreated). Keeping the PVC in its own file means only create_backend_object_storage (a
# one-time thing per namespace) ever touches it; update_backend_object_storage only
# re-applies the Service/StatefulSet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: object-storage
  name: object-storage-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: do-block-storage-retain
