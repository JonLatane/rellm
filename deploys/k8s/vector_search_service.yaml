# The per-namespace vector search service (backend `vector_search_service`): ONE pod per namespace that keeps all of
# the namespace's text embeddings in a USearch (quantized HNSW) index and answers nearest-neighbor queries for the
# namespace's Rellm servers, so the (usually two) servers neither hold nor scan the vectors themselves. Postgres stays
# the source of truth; this is a rebuildable cache that reads the embedding tables. Opt-in: see SEMANTIC_SEARCH.md.
#
# - replicas stays 1 (a second pod would just hold a second copy of the index); strategy Recreate. While it is
#   down or still building its index, searches silently use the Postgres scan (the service is optional).
# - Cluster-internal only (ClusterIP). Callers authenticate with `vector-service-secret` from this namespace's
#   rellm-data-credentials Secret, sent as `x-rellm-internal-secret`.
# - It indexes whatever model the cluster's shared embedding service runs (RELLM_EMBEDDING_SERVICE_URL); set
#   RELLM_VECTOR_SERVICE_MODEL instead if the namespace embeds in-process with a model of its own.
# - Memory is about 400 bytes per vector (int8 + graph); 100k rows ~ 40MB, 1M ~ 400MB -- size the limit to the data.
apiVersion: v1
kind: Service
metadata:
  name: rellm-vector
  labels:
    app: rellm-vector
spec:
  type: ClusterIP
  ports:
    - port: 8091
      targetPort: 8091
      name: grpc
  selector:
    app: rellm-vector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rellm-vector
  labels:
    app: rellm-vector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rellm-vector
  template:
    metadata:
      labels:
        app: rellm-vector
    spec:
      containers:
        - name: rellm-vector
          image: docker.io/jonlatane/rellm:0.5.553
          imagePullPolicy: IfNotPresent
          command: ["/opt/vector_search_service"]
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rellm-data-credentials
                  key: postgres-password
            - name: DATABASE_URL
              value: postgres://admin:$(DATABASE_PASSWORD)@rellm-postgres/rellm
            - name: RELLM_VECTOR_SERVICE_ADDR
              value: 0.0.0.0:8091
            - name: RELLM_VECTOR_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rellm-data-credentials
                  key: vector-service-secret
            - name: RELLM_EMBEDDING_SERVICE_URL
              value: http://rellm-central-embedding.rellm-storage:8090
            - name: RELLM_EMBEDDING_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rellm-data-credentials
                  key: embedding-service-secret
            - name: RUST_BACKTRACE
              value: full
          ports:
            - containerPort: 8091
              name: grpc
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 20
