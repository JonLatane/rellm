# Template for create_internal_central_data_backend/update_internal_central_data_backend (see
# ../Makefile) -- identical to server_internal.yaml, except DATABASE_URL/OBJECT_STORAGE_* point at
# the shared Postgres/object storage in ../central_storage (see that directory's README.md)
# instead of a per-namespace instance. ${NAMESPACE} and ${STORAGE_NAMESPACE} are substituted by
# ../Makefile's generation rule into k8s/server_internal_central_data.$(NAMESPACE).generated.yaml
# (gitignored, like ../ingress/k8s/*.generated.yaml) -- never edit that generated file directly,
# edit this template and regenerate.
#
# The database, bucket, and the Postgres role/Silo user that can access them are all named after
# ${NAMESPACE}. `NAMESPACE=... make create_backend_central_data` (central_storage/provision_namespace.sh)
# creates all of those AND generates their random credentials into this namespace's
# rellm-central-data Secret, which the env vars below read -- nothing secret lives in this file.
apiVersion: v1
kind: Service
metadata:
  name: rellm
  labels:
    app: rellm
spec:
  type: ClusterIP
  selector:
    app: rellm
  ports:
    - name: grpc
      protocol: TCP
      port: 27707
      targetPort: 27707
    - name: web-secure
      protocol: TCP
      port: 443
      targetPort: 443
    - name: web-insecure-1
      protocol: TCP
      port: 80
      targetPort: 80
    - name: web-insecure-2
      protocol: TCP
      port: 8000
      targetPort: 8000
    # Internal-only mail delivery endpoint used by the Stalwart mail server (see deploys/email)
    # -- see server_internal.yaml's identical comment for why this is safe to expose here.
    - name: mail-delivery
      protocol: TCP
      port: 27705
      targetPort: 27705
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rellm
  labels:
    app: rellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rellm
  template:
    metadata:
      labels:
        app: rellm
    spec:
      containers:
        - image: docker.io/jonlatane/rellm:0.5.553
          name: rellm
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rellm-central-data
                  key: database-url
            - name: OBJECT_STORAGE_ENDPOINT
              value: http://rellm-central-object-storage.${STORAGE_NAMESPACE}.svc.cluster.local:9000
            - name: OBJECT_STORAGE_REGION
              value: ""
            - name: OBJECT_STORAGE_BUCKET
              value: ${NAMESPACE}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rellm-central-data
                  key: object-storage-access-key
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rellm-central-data
                  key: object-storage-secret-key
            - name: RUST_BACKTRACE
              value: full
            - name: TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: rellm-generated-tls
                  key: tls.key
                  optional: true
            - name: TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: rellm-generated-tls
                  key: tls.crt
                  optional: true
            - name: CA_CERT
              valueFrom:
                configMapKeyRef:
                  name: rellm-generated-ca
                  key: ca.crt
                  optional: true
          ports:
            - containerPort: 27707
              protocol: TCP
              name: rellm
            - containerPort: 443
              protocol: TCP
              name: rellm-web-s
            - containerPort: 80
              protocol: TCP
              name: rellm-web-i1
            - containerPort: 8000
              protocol: TCP
              name: rellm-web-i2
            - containerPort: 27705
              protocol: TCP
              name: rellm-mail
---
# See server_internal.yaml's identical comment -- runs backend/background_jobs.sh in a single
# long-running pod instead of one k8s CronJob per job. replicas MUST stay at 1 and strategy MUST
# stay Recreate for the same reasons given there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rellm-jobs
  labels:
    app: rellm-jobs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rellm-jobs
  template:
    metadata:
      labels:
        app: rellm-jobs
    spec:
      containers:
        - image: docker.io/jonlatane/rellm:0.5.553
          name: rellm-jobs
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /opt/background_jobs.sh
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rellm-central-data
                  key: database-url
            - name: OBJECT_STORAGE_ENDPOINT
              value: http://rellm-central-object-storage.${STORAGE_NAMESPACE}.svc.cluster.local:9000
            - name: OBJECT_STORAGE_REGION
              value: ""
            - name: OBJECT_STORAGE_BUCKET
              value: ${NAMESPACE}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rellm-central-data
                  key: object-storage-access-key
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rellm-central-data
                  key: object-storage-secret-key
            - name: RUST_BACKTRACE
              value: full
