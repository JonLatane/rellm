apiVersion: v1
kind: Service
metadata:
  name: rellm
  labels:
    app: rellm
spec:
  type: ClusterIP
  # type: ExternalName
  # externalName: ${RELLM_HOST}
  selector:
    app: rellm
  ports:
    - name: grpc
      protocol: TCP
      port: 27707
      targetPort: 27707
    - name: web-secure
      protocol: TCP
      port: 443
      targetPort: 443
    - name: web-insecure-1
      protocol: TCP
      port: 80
      targetPort: 80
    - name: web-insecure-2
      protocol: TCP
      port: 8000
      targetPort: 8000
    # Internal-only mail delivery endpoint used by the Stalwart mail server (see
    # deploys/email) -- safe to expose here because this Service is ClusterIP, not
    # reachable from outside the cluster. Deliberately NOT present in
    # server_external.yaml's Service (a LoadBalancer) -- see the comment there.
    - name: mail-delivery
      protocol: TCP
      port: 27705
      targetPort: 27705
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rellm
  labels:
    app: rellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rellm
  template:
    metadata:
      labels:
        app: rellm
    spec:
      containers:
        - image: docker.io/jonlatane/rellm:0.5.553
          name: rellm
          env:
            - name: DATABASE_URL
              value: postgres://admin:secure_password1@rellm-postgres/rellm
            - name: OBJECT_STORAGE_ENDPOINT
              value: http://rellm-object-storage:9000
            - name: OBJECT_STORAGE_REGION
              value: ""
            - name: OBJECT_STORAGE_BUCKET
              value: rellm
            - name: OBJECT_STORAGE_ACCESS_KEY
              value: minio
            - name: OBJECT_STORAGE_SECRET_KEY
              value: minio123
            - name: RUST_BACKTRACE
              value: full
            # - name: TLS_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: rellm-generated-tls
            #       key: tls.key
            #       optional: true
            # - name: TLS_CERT
            #   valueFrom:
            #     secretKeyRef:
            #       name: rellm-generated-tls
            #       key: tls.crt
            #       optional: true
            - name: CA_CERT
              valueFrom:
                configMapKeyRef:
                  name: rellm-generated-ca
                  key: ca.crt
                  optional: true
          ports:
            - containerPort: 27707
              protocol: TCP
              name: rellm
            - containerPort: 443
              protocol: TCP
              name: rellm-web-s
            - containerPort: 80
              protocol: TCP
              name: rellm-web-i1
            - containerPort: 8000
              protocol: TCP
              name: rellm-web-i2
            - containerPort: 27705
              protocol: TCP
              name: rellm-mail
---
# Runs backend/background_jobs.sh (delete_expired_tokens, sync_sources,
# delete_unowned_media, update_user_counts, convert_media_sizes -- see that file for the
# authoritative list of jobs and their intervals) in a single long-running pod, one forked loop
# per job, instead of one k8s CronJob per job. CronJobs of this shape (5min-and-under schedules,
# times four jobs, times four namespaces) create a new pod -- and therefore a new CNI/Cilium
# network endpoint -- every few minutes; that churn was a major contributor to the 2026-09-04
# node incident (see incident notes), so this trades it for one steady-state pod per namespace.
#
# replicas MUST stay at 1 (running two would duplicate every job -- notably sync_sources,
# which posts to external SyncDestinations, so a duplicate run isn't just wasted work, it's a
# real double-post) and strategy MUST stay Recreate (a RollingUpdate would briefly run the old and
# new pod's job loops at once during a deploy, same problem).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rellm-jobs
  labels:
    app: rellm-jobs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rellm-jobs
  template:
    metadata:
      labels:
        app: rellm-jobs
    spec:
      containers:
        - image: docker.io/jonlatane/rellm:0.5.553
          name: rellm-jobs
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /opt/background_jobs.sh
          env:
            - name: DATABASE_URL
              value: postgres://admin:secure_password1@rellm-postgres/rellm
            - name: OBJECT_STORAGE_ENDPOINT
              value: http://rellm-object-storage:9000
            - name: OBJECT_STORAGE_REGION
              value: ""
            - name: OBJECT_STORAGE_BUCKET
              value: rellm
            - name: OBJECT_STORAGE_ACCESS_KEY
              value: minio
            - name: OBJECT_STORAGE_SECRET_KEY
              value: minio123
            - name: RUST_BACKTRACE
              value: full
