# The PVC (minio-pv-claim) lives in the sibling k8s-minio-pvc-$(K8S_PROVIDER).yaml, not
# here -- see that file for why. create_backend_minio applies both; update_backend_minio
# only applies this one.
apiVersion: v1
kind: Service
metadata:
  name: rellm-minio
  labels:
    app: rellm-minio
spec:
  clusterIP: None
  ports:
    - port: 9000
      protocol: TCP
  selector:
    app: rellm-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rellm-minio
  labels:
    app: rellm-minio
spec:
  serviceName: rellm-minio
  replicas: 1
  selector:
    matchLabels:
      app: rellm-minio
  template:
    metadata:
      labels:
        app: rellm-minio
    spec:
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio-pv-claim
      containers:
      - name: minio
        image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
        args:
        - server
        - /storage
        env:
        - name: MINIO_ACCESS_KEY
          value: "minio"
        - name: MINIO_SECRET_KEY
          value: "minio123"
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: storage
          mountPath: "/storage"
