# The PVC (minio-pv-claim) lives in the sibling k8s-minio-pvc-$(K8S_PROVIDER).yaml, not
# here -- see that file for why. create_backend_minio applies both; update_backend_minio
# only applies this one.
apiVersion: v1
kind: Service
metadata:
  name: rellm-minio
  labels:
    app: rellm-minio
spec:
  clusterIP: None
  ports:
    - port: 9000
      protocol: TCP
  selector:
    app: rellm-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rellm-minio
  labels:
    app: rellm-minio
spec:
  serviceName: rellm-minio
  replicas: 1
  selector:
    matchLabels:
      app: rellm-minio
  template:
    metadata:
      labels:
        app: rellm-minio
    spec:
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio-pv-claim
      containers:
      # bitnamilegacy/minio, not quay.io/minio/minio -- MinIO locked down anonymous pulls of
      # quay.io/minio/minio (401 "unauthorized" on every tag, pinned ones included) after
      # archiving the OSS project. bitnamilegacy/minio is Bitnami's frozen/unsupported-but-
      # still-pullable image; it starts the server itself via its own entrypoint, so no
      # `server /storage` args override here -- MINIO_DATA_DIR points it at /storage instead.
      - name: minio
        image: bitnamilegacy/minio:latest
        env:
        - name: MINIO_ROOT_USER
          value: "minio"
        - name: MINIO_ROOT_PASSWORD
          value: "minio123"
        - name: MINIO_DATA_DIR
          value: "/storage"
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: storage
          mountPath: "/storage"
