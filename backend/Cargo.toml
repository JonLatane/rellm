[package]
name = "rellm"
version = "0.5.553"
edition = "2024"

authors = ["Jon Latané <jonlatane@gmail.com>"]

license = "AGPL"
repository = "https://github.com/jonlatane/rellm"
description = "Rellm is a decentralized social network server."
homepage = "https://rellm.org"
default-run = "rellm"
readme = "README.md"

[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'

[dependencies]
tokio = { version = "1.20.0", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "sync",
] }
tokio-stream = "0.1.15"
tonic = { version = "0.14.6", features = [
  "tls-ring",
  "tls-native-roots",
  "tls-webpki-roots",
  "gzip",
] }
tonic-reflection = "0.14.6"
tonic-web = "0.14.6"
tonic-prost = "0.14.6"
tower-http = { version = "0.7.0", features = [
  "cors",
] } # used to configure CORS for Tonic Web
rocket = { version = "0.5.1", features = ["tls"] }
rocket_async_compression = "0.6.1"
async-compression = "0.4.12"
rocket-cache-response = "0.7.0"
futures = "0.3.24"
chrono = "0.4.38"
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = { version = "0.14.4", features = ["std"] }
prost-wkt = "0.7.1"
prost-wkt-types = "0.7.1"
diesel = { version = "2.3.12", features = ["postgres", "r2d2", "serde_json"] }
diesel_migrations = "2.3.2"
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
# Not used directly -- pulled in transitively by diesel's "postgres" feature.
# Declared here only so its "bundled" feature (vendors & statically compiles
# libpq via pq-src, satisfying diesel's `pq-sys >=0.4.0, <0.8.0` requirement)
# can be turned on for the `static_pq` feature below, used by the Linux
# release build (create_linux_release job) so the resulting binary doesn't
# depend on a system libpq install.
pq-sys = { version = "0.7.5", optional = true, features = ["bundled"] }
serde = "1.0.209"
serde_json = "1.0.127"
dotenvy = "0.15.7"
bcrypt = "0.19.3"
bs58 = "0.5.1"
ring = "0.17.8"
regex = "1.10.6"
itertools = "0.15.0"
anyhow = "1.0.86"
log = "0.4.17"
uuid = { version = "1.24.1", features = ["v4", "fast-rng"] }
lazy_static = "1.5.0"
env_logger = "0.11.5"
rust-s3 = { version = "0.37.2" }
aws-creds = "0.39.1"
# aws-region = "0.26.0"
bytes = "1.7.1"
tempfile = "3.12.0"
percent-encoding = "2.3.0"
# Parses Twilio's `application/x-www-form-urlencoded` inbound SMS webhook body -- see
# `web::contact_integrations_webhook`.
form_urlencoded = "1.2.2"
ico = "0.5.0"

# For Preview Generator images only
headless_chrome = "1.0.14"

rustls = { version = "0.23.43", features = ["ring"] }

rand = "0.10.2"
http = "1.5.0"
base64 = "0.23.1"
web-push = "0.11.0"
icalendar = { version = "0.17.13", features = ["chrono-tz"] }
# lat/lng -> IANA timezone lookup for `logic::geocoding` -- offline (bundled dataset), no API key,
# no rate limit, unlike the network calls `logic::geocoding` still needs for the address -> lat/lng
# half of that lookup (see that module's doc comment).
tzf-rs = "1.3.7"
chrono-tz = "0.10.4"
diesel_full_text_search = "2.3.0"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "query",
  "form",
  "json",
  # Needed for `logic::mastodon_sync::upload_media`'s `multipart/form-data` upload to Mastodon's
  # `/api/v2/media` endpoint (the only sync platform whose media API takes raw file bytes rather
  # than a remote URL).
  "multipart",
  # Avoids pulling in the aws-lc-rs crypto backend (which reqwest's plain
  # "rustls" feature defaults to); we install the ring CryptoProvider
  # globally at startup (see lib.rs) and rely on that everywhere, matching
  # tonic's "tls-ring" feature.
  "rustls-no-provider",
] }
rrule = "0.14"
mail-parser = "0.11.5"
feed-rs = "2.4.0"
rss = { version = "2.1.2", default-features = false, features = ["builders"] }
atom_syndication = { version = "0.12.10", default-features = false, features = ["builders"] }

[features]
static_pq = ["dep:pq-sys"]

[build-dependencies]
tonic-prost-build = "0.14.6"
prost-wkt-build = "0.7.1"
