syntax = "proto3";

package rellm;
import "media.proto";
import "permissions.proto";
import "google/protobuf/timestamp.proto";

// To back this all we need the following tables:
// * market_products
//    * represents our "storefront state"
// * market_subscriptions
//    * market_product_id NOT NULL
//    * essentially, data is copied from market_products when a user makes a subscription and
//      purchases their first month/year/indefinite bit (with a payment)
// * market_purchases
//    * market_product_id NOT NULL, market_subscription_id NULL (though we won't use NULL values at the moment)
//    * market_subscriptions have 1..n purchases
//    * market_purchases have 0..1 market_subscriptions
// * market_payments
// * market_refunds - or should we keep this and market_payments in the same table, allow negative values, and marshall them to the appropriate `MarketPayment`/`MarketRefund` in Rust?
// * market_payment_methods/market_refund_methods? Or should these just be stored on market_payments/market_refunds? Depends how Stripe (and other providers) work.

// New RPCs needed:
// * GetMarketProducts(GetMarketProductsRequest) - unauthenticated. Admins can see delisted products.
// * CreateMarketProduct(MarketProduct), UpdateMarketProduct(MarketProduct) - authenticated, admin required
// * GetMarketSubscriptions(User)
// * MakeMarketPurchase(User)

// New background job needed (in Rust bin/):
// * renew_market_subscriptions.rs - handles all three PurchaseTypes in one pass.

// New Elm page/routes needed:
// * /market
//     * We should define this in the SPA web app paths in rust, so the preview can be "Market | Rellm.org" or "Market | Oak City Social", etc.
// * /market/product/productId

// New Elm UI updates:
// * New collapsible Subscriptions section on UserProfilePage, just above Permissions section.
//     * No purchasing here. Just lists all the user's MarketPurchases are made via flows from `/market`/`Pages/Market.elm`.
// * AccountsPanel Account Chips, when expanded
//     * This means RellmAccount in Elm will need to store MarketSubscriptions, I think, same as it does AI Model providers, etc.


enum PurchaseType {
  PURCHASE_TYPE_MEDIA_STORAGE = 0;
  PURCHASE_TYPE_AI_GRANTS = 1;
  PURCHASE_TYPE_RELLM_HOSTING = 2;
  PURCHASE_TYPE_PERMISSIONS_ACCESS = 3;
}

enum PurchasePeriod {
  PURCHASE_PERIOD_INDEFINITE = 0;
  PURCHASE_PERIOD_ANNUAL = 1;
  PURCHASE_PERIOD_MONTHLY = 2;
}

// An actual subscribable product listed on, say, https://rellm.org/market
// Listed/delisted by clients by setting `delisted_at` (though the actual date supplied
// by the client is ignored).
message MarketProduct {
  string id = 1;
  // Never changeable after product creation.
  PurchaseType type = 2;
  // Never changeable after product creation.
  PurchasePeriod period = 3;
  uint32 amount = 4;
  uint32 currency = 5;

  // Number of subscriptions "slots" availbable (admin-set)
  uint32 available_count = 6;
  // Number of subscriptions actually sold. Canceled subscriptions reduce this number,
  // allowing a new person to subscribe.
  uint32 sold_count = 7;

  oneof details {
    MediaStorageSubscriptionDetails media_storage_subscription_details = 10;
    AIGrantSubscriptionDetails ai_grant_subscription_details = 11;
    RellmHostingSubscriptionDetails rellm_hosting_subscription_details = 12;
    PermissionsAccessSubscriptionDetails permissions_access_subscription_details = 13;
  }

  google.protobuf.Timestamp created_at = 20;

  // If set, the MarketProduct is not purchasable. Note: clients toggle listings by setting this,
  // but the server will always set it to the time of the request, not the time sent *by* the request.
  optional google.protobuf.Timestamp delisted_at = 21;
}

// Request to get products available for purchase on a Rellm server.
// For now, there are few enough that this has no parameters.
message GetMarketProductsRequest {

}

message GetMarketProductsResponse {
  // Non-delisted products, plus delisted ones too if the caller is an admin.
  repeated MarketProduct market_products = 1;
}

// Request to get MarketSubscriptions -- self-scoped to the current user's own
// (`GET_MARKET_SUBSCRIPTIONS_REQUEST_FOR_PURCHASE`, the default -- there's no way to fetch another
// user's own subscriptions this way, even as an admin), or -- for an admin only --
// `GET_MARKET_SUBSCRIPTIONS_REQUEST_FOR_FULFILLMENT_ADMIN`, every `PURCHASE_TYPE_RELLM_HOSTING`
// subscription across every buyer, for the `/market/fulfillment` admin page.
message GetMarketSubscriptionsRequest {
  GetMarketSubscriptionsRequestType request_type = 1;
}

enum GetMarketSubscriptionsRequestType {
  // The "user facing" view backing /market -- the caller's own MarketSubscriptions only.
  GET_MARKET_SUBSCRIPTIONS_REQUEST_FOR_PURCHASE = 0;
  // Admin-only view backing /market/fulfillment -- every PURCHASE_TYPE_RELLM_HOSTING
  // MarketSubscription across every buyer, since Rellm hosting needs manual setup that isn't
  // automated (see RellmHostingSubscriptionDetails.fulfilled's own doc).
  GET_MARKET_SUBSCRIPTIONS_REQUEST_FOR_FULFILLMENT_ADMIN = 1;
}

message GetMarketSubscriptionsResponse {
  repeated MarketSubscription market_subscriptions = 1;
}

// *Authenticated*. Buys `market_product_id` for the current user, starting (or continuing) a
// Stripe Checkout flow -- see `MakeMarketPurchaseResponse.checkout_url`. No `MarketPurchase`/
// `MarketSubscription` is created by this call itself; that only happens once Stripe confirms
// payment via webhook, so an abandoned checkout never leaves a half-created purchase behind.
message MakeMarketPurchaseRequest {
  string market_product_id = 1;

  // Only meaningful (and required) for a `PURCHASE_TYPE_RELLM_HOSTING` product -- the buyer's
  // desired domain/contact info/notes, carried through to Stripe as Checkout Session metadata and
  // copied onto the resulting `MarketPurchase`/`MarketSubscription` once payment completes.
  optional RellmHostingPurchaseDetails rellm_hosting_details = 2;
}

message MakeMarketPurchaseResponse {
  // Redirect the buyer's browser here (a Stripe-hosted Checkout page) to complete payment.
  string checkout_url = 1;
}

message MarketPurchase {
  string id = 1;
  Author buyer = 2;
  PurchaseType type = 3;

  MarketProduct market_product = 4;

  // Note: this circular relationship should be handled by the Rust marshaling side.
  optional MarketSubscription market_subscription = 5;

  repeated MarketPayment market_payments = 6;
  repeated MarketRefund market_refunds = 7;

  oneof details {
    MediaStoragePurchaseDetails media_storage_purchase_details = 10;
    AIGrantPurchaseDetails ai_grant_purchase_details = 11;
    RellmHostingPurchaseDetails rellm_hosting_purchase_details = 12;
    PermissionsAccessPurchaseDetails permissions_access_purchase_details = 13;
  }

  google.protobuf.Timestamp created_at = 20;
}

message MarketPayment {
  uint32 amount = 1;
  uint32 currency = 2;
  string market_purchase_id = 3;
  // The card actually charged, if known/resolvable at the time this MarketPayment was recorded.
  optional MarketPaymentMethod method = 4;
  google.protobuf.Timestamp created_at = 10;
}

// Card details for a MarketPayment, resolved from Stripe at charge time (Stripe's own
// `PaymentMethod.card` object). Unset entirely if the payment wasn't card-based or details
// couldn't be resolved. Never carries anything more sensitive than what Stripe itself considers
// safe to display (brand/last4/expiry) -- never a full card number.
message MarketPaymentMethod {
  // E.g. "visa", "mastercard", "amex".
  string card_brand = 1;
  // Last 4 digits of the card number.
  string card_last4 = 2;
  uint32 card_exp_month = 3;
  uint32 card_exp_year = 4;
}

message MarketRefund {
  uint32 amount = 1;
  uint32 currency = 2;
  string market_purchase_id = 3;
  // The card the refund was issued back to -- in practice always the same card as the
  // MarketPayment being refunded, since Stripe refunds are only ever issued back to their
  // original payment method.
  optional MarketRefundMethod method = 4;
  google.protobuf.Timestamp created_at = 10;
}
// Same shape as MarketPaymentMethod -- kept as its own message (rather than reusing
// MarketPaymentMethod directly) since a MarketRefund and the MarketPayment it refunds are
// otherwise-independent messages, matching the MarketPayment/MarketRefund split itself.
message MarketRefundMethod {
  string card_brand = 1;
  string card_last4 = 2;
  uint32 card_exp_month = 3;
  uint32 card_exp_year = 4;
}

message MediaStoragePurchaseDetails {
  uint64 allocation_bytes = 1;
}

message AIGrantPurchaseDetails {
  string ai_provider_id = 1;
  repeated string model_names = 2;
  uint64 tokens = 3;
}

message RellmHostingPurchaseDetails {
  uint64 db_size_bytes = 1;
  uint64 minio_size_bytes = 2;
  string domain = 3;
  string contact_email = 4;
  string additional_information = 5;
}

message PermissionsAccessPurchaseDetails {
  repeated Permission permissions = 1;
}

message MarketSubscription {
  string id = 1;
  Author buyer = 2;
  PurchaseType type = 3;
  PurchasePeriod period = 4;
  uint32 amount = 5;
  uint32 currency = 6;

  // Note: marshaling should handle the circular relationship here gracefully.
  MarketProduct market_product = 7;

  repeated MarketPurchase billing_history = 8;

  oneof details {
    MediaStorageSubscriptionDetails media_storage_subscription_details = 10;
    AIGrantSubscriptionDetails ai_grant_subscription_details = 11;
    RellmHostingSubscriptionDetails rellm_hosting_subscription_details = 12;
    PermissionsAccessSubscriptionDetails permissions_access_subscription_details = 13;
  }

  google.protobuf.Timestamp created_at = 20;
  optional google.protobuf.Timestamp renews_at = 21;

  // Set once the subscription will no longer renew -- either the buyer/admin explicitly canceled it
  // (CancelMarketSubscription) or a renewal charge failed. The subscription's entitlement (media
  // storage quota, granted permissions, etc.) stays active until whichever is later of
  // renews_at/canceled_at, at which point renew_market_subscriptions.rs revokes it and sets
  // service_terminated_at.
  optional google.protobuf.Timestamp canceled_at = 22;

  // The time permissions were removed, media storage quotas reset, etc.
  optional google.protobuf.Timestamp service_terminated_at = 23;

}

message MediaStorageSubscriptionDetails {
  uint64 allocation_bytes = 1;
}

message AIGrantSubscriptionDetails {
  string ai_provider_id = 1;
  repeated string model_names = 2;
  uint64 tokens = 3;
}

message RellmHostingSubscriptionDetails {
  uint64 db_size_bytes = 1;
  uint64 minio_size_bytes = 2;
  string domain = 3;
  string contact_email = 4;
  // Immutable after purchase -- the buyer's own notes to the admin fulfilling this order. Never
  // editable via UpdateMarketSubscription (see that RPC's own doc); `fulfillment_notes` below is
  // the admin/buyer conversation about fulfilling it.
  string additional_information = 5;

  // Whether an admin has actually stood up this Rellm hosting order -- Rellm hosting is
  // deliberately not automated (see `market.proto`'s own top-of-file notes and
  // `logic::market_fulfillment::fulfill_purchase`'s `RellmHosting` no-op arm), so this is the one
  // manual "is this order done" signal, shown/toggled on `/market/fulfillment`
  // (`GET_MARKET_SUBSCRIPTIONS_REQUEST_FOR_FULFILLMENT_ADMIN`).
  bool fulfilled = 6;

  // The admin/buyer conversation about fulfilling this order -- oldest to newest, append-only (see
  // `UpdateMarketSubscription`'s own doc: a new entry can only ever be appended after whatever's
  // already here, never inserted/reordered/removed, and its `user_id` must match whoever's actually
  // making the request -- the server stamps `created_at` itself).
  repeated FulfillmentNote fulfillment_notes = 7;
}

// One entry in a MarketSubscription's `fulfillment_notes` -- see that field's own doc.
message FulfillmentNote {
  string user_id = 1;
  string note = 2;
  google.protobuf.Timestamp created_at = 3;
}


message PermissionsAccessSubscriptionDetails {
  repeated Permission permissions = 1;
}
