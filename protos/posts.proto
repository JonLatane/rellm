syntax = "proto3";

package rellm;

// import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
// import "users.proto";
import "visibility_moderation.proto";
import "media.proto";
import "sync.proto";

// Valid GetPostsRequest formats:
//
// - `{[listing_type: AllAccessiblePosts]}`
//     - Get ServerPublic/GlobalPublic posts you can see based on your authorization (or lack thereof).
// - `{listing_type:MyGroupsPosts|FollowingPosts}`
//     - Get posts from groups you're a member of or from users you're following. Authorization required.
// - `{post_id:}`
//     - Get one post ,including preview data/
// - `{post_id:, reply_depth: 1}`
//     - Get replies to a post - only support for replyDepth=1 is done for now though.
// - `{listing_type: MyGroupsPosts|[`GroupPost`](#rellm-GroupPost)sPendingModeration, group_id:}`
//     - Get posts/posts needing moderation for a group. Authorization may be required depending on group visibility.
// - `{author_user_id:, group_id:}`
//     - Get posts by a user for a group. (TODO)
// - `{listing_type: AuthorPosts, author_user_id:}`
//     - Get posts by a user. (TODO)
// - `{listing_type: TextSearch, search_text:}`
//     - Full-text search across accessible posts' author username/real name, title, link, and content.
//     - `{listing_type: TextSearch, search_text:, author_user_id:}` scopes the search to one author.
message GetPostsRequest {
  // Returns the single post with the given ID.
  optional string post_id = 1;
  // Limits results to those by the given author user ID.
  optional string author_user_id = 2;
  // Excludes results by any of the given author user IDs. Applies to every feed-style listing (all
  // listing types except single `post_id`/reply lookups). Numbered out of order (it logically belongs
  // right after `author_user_id`) so as not to break compatibility; the order will be straightened out in a
  // later protocol version.
  repeated string excluded_author_user_ids = 16;
  // Limits results to those in the given group ID.
  optional string group_id = 3;
  // Only supported for depth=2 for now.
  optional uint32 reply_depth = 4;
  // Only POST and REPLY are supported for now.
  optional PostContext context = 5;
  // Returns expanded posts with the given IDs.
  optional string post_ids = 9;
  // The listing type of the request. See [`PostListingType`](#rellm-PostListingType) for more info.
  PostListingType listing_type = 10;
  // The page of results to return. Defaults to 0.
  uint32 page = 15;
  // Full-text search query, matched against the author's username/real name and the post's
  // title/link/content. Required (and only used) when `listing_type` is `TEXT_SEARCH`.
  optional string search_text = 7;

  // Request to only return posts that were published or created before the given timestamp.
  optional google.protobuf.Timestamp published_or_created_before = 8;
}

// Used for getting posts.
message GetPostsResponse {
  // The posts returned by the request.
  repeated Post posts = 1;
}

// A high-level enumeration of general ways of requesting posts.
enum PostListingType {
  // Gets SERVER_PUBLIC and GLOBAL_PUBLIC posts as is sensible.
  // Also usable for getting replies anywhere.
  ALL_ACCESSIBLE_POSTS = 0;
  // Returns posts from users the user is following.
  FOLLOWING_POSTS = 1;
  // Returns posts from any group the user is a member of.
  MY_GROUPS_POSTS = 2;
  // Returns `DIRECT` posts that are directly addressed to the user.
  DIRECT_POSTS = 3;
  // Returns posts pending moderation by the server-level mods/admins.
  POSTS_PENDING_MODERATION = 4;
  // Returns posts matching the full-text `search_text` query, scoped the same way
  // ALL_ACCESSIBLE_POSTS is (plus author_user_id, if provided). Requires search_text parameter.
  TEXT_SEARCH = 5;
  // Returns posts published recently (within the last 14 days, or, if `published_or_created_before`
  // is given, the 14 days before that time), scoped the same way ALL_ACCESSIBLE_POSTS is (plus
  // author_user_id, if provided), ranked by popularity rather than strictly by recency. A post's score
  // is `(unauthenticated_star_count + 2 * response_count + 1) / (age_in_hours + 2) ^ 1.5` - engagement
  // (stars, and responses to the post, which count double) decayed by how long ago it was published
  // (`published_at`, falling back to `created_at`), like Hacker News' ranking. The `+ 1` means a post
  // with no engagement still scores, just lower, and ties fall to recency - so on a quiet server this
  // degrades gracefully to roughly ALL_ACCESSIBLE_POSTS. Like every listing, returns at most one
  // page of results; `page` continues down the same ranking, which drifts a little as time passes (every
  // score depends on the current age of its post), so a client paging through should skip posts it has
  // already seen - or pin `published_or_created_before` to keep the ranking still while it does.
  RECENTLY_POPULAR_POSTS = 6;

  // Returns posts from a specific group. Requires group_id parameter.
  GROUP_POSTS = 10;
  // Returns pending_moderation posts from a specific group. Requires group_id
  // parameter and user must have group (or server) admin permissions.
  GROUP_POSTS_PENDING_MODERATION = 11;
}

// Differentiates the context of a Post, as in Rellm's data models, Post is the "core" type where Rellm consolidates moderation and visibility data and logic.
enum PostContext {
  // "Standard" or "Top-Level" Post. Can have media, a link, a title, and/or content.
  // If provided, its `link` and `title` are permanent.
  POST = 0;

  // Reply to a `POST`, `REPLY`, `EVENT`, or `OCCASION`
  // Does not support a `link`. Requires a `reply_to_post_id`.
  REPLY = 1;

  // Post behind an "Event" (which does not actually have a start/end time - 
  // it's a group of Occasions, at least one, which each do).
  // The Events table should have a row for this Post.
  // Never created by the CreatePost RPC (this is an error); use CreateEvent.
  // These Posts' `link` and `title` fields are modifiable.
  EVENT = 2;

  // An "Occasion" Post (which relates to an event with a start and end time).
  // The Occasions table should have a row for this Post.
  // Never created by the CreatePost RPC (this is an error); use CreateEvent/UpdateEvent to manage Occasions implicitly.
  // These Posts' `link` and `title` fields are modifiable.
  OCCASION = 3;

 // A reply to a Post on another server. The post *must* have a link of the format `http[s]://<server/post/<post_id>`
 // in its `link` field. It will not have a `reply_to_post_id` value.
  FEDERATED_REPLY = 10;
}

// A `Post` is a message that can be posted to the server. Its `visibility`
// as well as any associated [`GroupPost`](#rellm-GroupPost)s and [`UserPost`](#rellm-UserPost)s determine what users
// see it and where.
//
// `Post`s are also a fundamental unit of the system. They provide a building block
// of Visibility and Moderation management that is used throughout Posts, Replies, Events,
// and Occasions.
message Post {
  // `embed_link` (12) was removed: a link to a supported social media site (or Rellm/Bluesky/Mastodon post) is
  // always embedded by clients that support it.
  reserved 12;
  reserved "embed_link";

  // Unique ID of the post.
  string id = 1;
  // The author of the post. This is a smaller version of User.
  optional Author author = 2;
  // If this is a reply, this is the ID of the post it's replying to.
  optional string reply_to_post_id = 3;

  // The title of the post. This is invalid for replies.
  optional string title = 4;
  // The link of the post. This is invalid for replies.
  optional string link = 5;
  // The content of the post. This is required for replies.
  optional string content = 6;

  // The number of responses (replies *and* replies to replies, etc.) to this post.
  int32 response_count = 7;
  // The number of *direct* replies to this post.
  int32 reply_count = 8;
  // The number of groups this post is in.
  int32 group_count = 9;

  // List of Media IDs associated with this post. Order is preserved.
  repeated MediaReference media = 10;
  // Flag indicating whether Media has been generated for this Post.
  // Currently previews are generated for any Link post.
  bool media_generated = 11;
  // Flag indicating a `LIMITED` or `SERVER_PUBLIC` post can be shared with groups and individuals,
  // and a `DIRECT` post can be shared with individuals.
  bool shareable = 13;
  // Context of the Post (`POST`, `REPLY`, `EVENT`, or `OCCASION`.)
  PostContext context = 14;
  // The visibility of the Post.
  Visibility visibility = 15;
  // The moderation of the Post.
  Moderation moderation = 16;

  // The desired end-user layout of Media attached to the post.
  PostMediaLayout post_media_layout = 17;

  // If the Post was retrieved from GetPosts with a group_id, the GroupPost
  // metadata may be returned along with the Post.
  optional GroupPost current_group_post = 18;

  // Hierarchical replies to this post. There will never be more than `reply_count` replies. However,
  // there may be fewer than `reply_count` replies if some replies are
  // hidden by moderation or visibility. Replies are not generally loaded by default, but can be added to Posts
  // in the frontend.
  repeated Post replies = 19;

  // The time the post was created.
  google.protobuf.Timestamp created_at = 20;
  // The time the post was last updated.
  optional google.protobuf.Timestamp updated_at = 21;
  // The time the post was published (its visibility first changed to `SERVER_PUBLIC` or `GLOBAL_PUBLIC`).
  optional google.protobuf.Timestamp published_at = 22;
  // The time the post was last interacted with (replied to, etc.)
  google.protobuf.Timestamp last_activity_at = 23;

  // The number of unauthenticated stars on the post.
  int64 unauthenticated_star_count = 24;

  // SyncDestinations this post has been synced (cross-posted) to, and their status.
  repeated SyncDestinationStatus sync_destinations = 25;

  // If the Post was created/is kept in sync from a [`SyncSource`](#rellm-SyncSource) (an ICS
  // Event/Occasion, or an RSS/Atom feed item), this is the source it was synced from.
  // Only its media should be considered editable for such a Post.
  optional SyncSource sync_source = 26;

  // A post this post quotes (embeds), for posts translated from a federated network such as Bluesky
  // or Mastodon. Only ever set client-side by the Elm frontend's federation translators -- Rellm
  // servers never populate it. May itself quote another post, up to however many levels the client
  // chose to resolve.
  //
  // A Rellm post quotes another post by putting a link to it in its own `link` -- clients embed it
  // when `link` is (or points at) a `/post/{id}`, `/event/{id}` or short `/{x}{id}` URL on any Rellm
  // server, or a Bluesky or Mastodon post (its own URL, or a Rellm `/post/{id}@bluesky:` /
  // `@mastodon:{host}` route). That's only meaningful on a `POST`-context post (`link` is invalid for replies).
  optional Post quoted_post = 27;
}

// Syncs (cross-posts) a single Post to one SyncDestination.
message SyncPostRequest {
  // The Post to sync.
  string post_id = 1;
  // The SyncDestination to sync it to.
  string sync_destination_id = 2;
}

// Removes a single Post's sync (cross-post) to one SyncDestination - the reverse of [`SyncPost`](#grpc-api-SyncPost).
// Does not delete the post already made on the destination (e.g. the Facebook Page post), only the local sync record.
message DeletePostSyncDestinationRequest {
  // The Post to un-sync.
  string post_id = 1;
  // The SyncDestination to un-sync it from.
  string sync_destination_id = 2;
}

enum PostMediaLayout {
  MEDIA_LAYOUT_STANDARD = 0;
  MEDIA_LAYOUT_DYNAMIC_VERTICAL_SCROLL = 1;
}

// A `GroupPost` is a cross-post of a [`Post`](#rellm-Post) to a [`Group`](#rellm-Group). It contains
// information about the moderation of the post in the group, as well as
// the time it was cross-posted and the user who did the cross-posting.
message GroupPost {
  // The ID of the group this post is in.
  string group_id = 1;
  // The ID of the post.
  string post_id = 2;
  // **Deprecated.** Prefer to use `shared_by`. The ID of the user who cross-posted the post.
  string user_id = 3 [deprecated = true];
  // The moderation of the post in the group.
  Moderation group_moderation = 4;
  // The time the post was cross-posted.
  google.protobuf.Timestamp created_at = 5;
  // Author info for the user who cross-posted the post.
  Author shared_by = 6;
}

// A `UserPost` is a "direct share" of a [`Post`](#rellm-Post) to a [`User`](#rellm-User). Currently unused/unimplemented.
// See also: [`DIRECT` `Visibility`](#rellm-Visibility).
message UserPost {
  // The ID of the user the post is shared with.
  string user_id = 1;
  // The ID of the post shared.
  string post_id = 2;
  // The time the post was shared.
  google.protobuf.Timestamp created_at = 3;
}

// Used for getting context about [`GroupPost`](#rellm-GroupPost)s of an existing [`Post`](#rellm-Post).
message GetGroupPostsRequest {
  // The ID of the post to get [`GroupPost`](#rellm-GroupPost)s for.
  string post_id = 1;
  // The ID of the group to get [`GroupPost`](#rellm-GroupPost)s for.
  optional string group_id = 2;
}

// Used for getting context about [`GroupPost`](#rellm-GroupPost)s of an existing [`Post`](#rellm-Post).
message GetGroupPostsResponse {
  // The [`GroupPost`](#rellm-GroupPost)s for the given [`Post`](#rellm-Post) or [`Group`](#rellm-Group).
  repeated GroupPost group_posts = 1;
}
