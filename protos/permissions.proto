syntax = "proto3";

package rellm;

// Rellm Permissions are a set of permissions that can be granted directly to [`User`](#rellm-User)s and [`Membership`](#rellm-Membership)s.
// (A [`Membership`](#rellm-Membership) is the link between a [`Group`](#rellm-Group) and a [`User`](#rellm-User).)
//
// Subsets of these permissions are also applicable to anonymous users via [`anonymous_user_permissions` in `ServerConfiguration`](#rellm-ServerConfiguration),
// and to Group non-members via [`non_member_permissions` in `Group`](#rellm-Group), as well as others documented there.
enum Permission {
  // A permission that could not be read using the Rellm protocol. (Perhaps, a permission from a newer Rellm version.)
  PERMISSION_UNKNOWN = 0;
  // Allow the user to view profiles with `SERVER_PUBLIC` Visibility.
  // Allow anonymous users to view profiles with `GLOBAL_PUBLIC` Visibility (when configured as an anonymous user permission).
  VIEW_USERS = 1;
  // Allow the user to publish profiles with `SERVER_PUBLIC` Visibility.
  // This generally only applies to the user's own profile, except for Admins.
  PUBLISH_USERS_LOCALLY = 2;
  // Allow the user to publish profiles with `GLOBAL_PUBLIC` Visibility.
  // This generally only applies to the user's own profile, except for Admins.
  PUBLISH_USERS_GLOBALLY = 3;
  // Allow the user to grant `VIEW_POSTS`, `CREATE_POSTS`, `VIEW_EVENTS`
  // and `CREATE_EVENTS` permissions to users.
  MODERATE_USERS = 4;
  // Allow the user to follow other users.
  FOLLOW_USERS = 5;
  // Allow the user to grant Basic Permissions to other users. "Basic Permissions"
  // are defined by your [`ServerConfiguration`](#rellm-ServerConfiguration)'s `basic_user_permissions`.
  GRANT_BASIC_PERMISSIONS = 6;

  // Allow the user to view groups with `SERVER_PUBLIC` visibility.
  // Allow anonymous users to view groups with `GLOBAL_PUBLIC` visibility (when configured as an anonymous user permission).
  VIEW_GROUPS = 10;
  // Allow the user to create groups.
  CREATE_GROUPS = 11;
  // Allow the user to give groups `SERVER_PUBLIC` visibility.
  PUBLISH_GROUPS_LOCALLY = 12;
  // Allow the user to give groups `GLOBAL_PUBLIC` visibility.
  PUBLISH_GROUPS_GLOBALLY = 13;
  // The Moderate Groups permission makes a user effectively an admin of *any* group.
  MODERATE_GROUPS = 14;
  // Allow the user to (potentially request to) join groups of `SERVER_PUBLIC` or higher
  // visibility.
  JOIN_GROUPS = 15;
  // Allow the user to invite other users to groups. Only applicable as a Group permission (not at the User level).
  INVITE_GROUP_MEMBERS = 16;

  // As a user permission, allow the user to view posts with `SERVER_PUBLIC` or higher visibility. 
  // As a group permission, allow the user to view [`GroupPost`](#rellm-GroupPost)s whose [`Post`](#rellm-Post)s have `LIMITED` or higher visibility.
  // Allow anonymous users to view posts with `GLOBAL_PUBLIC` visibility (when configured as an anonymous user permission).
  VIEW_POSTS = 20;
  // As a user permission, allow the user to create [`Post`](#rellm-Post)s of `PRIVATE` and `LIMITED` visibility.
  // As a group permission, allow the user to create [`GroupPost`](#rellm-GroupPost)s for `POST` and `FEDERATED_POST` [`PostContext`](#rellm-PostContext)s..
  CREATE_POSTS = 21;
  // Allow the user to publish posts with `SERVER_PUBLIC` visibility.
  PUBLISH_POSTS_LOCALLY = 22;
  // Allow the user to publish posts with `GLOBAL_PUBLIC` visibility.
  PUBLISH_POSTS_GLOBALLY = 23;
  // Allow the user to moderate posts.
  MODERATE_POSTS = 24;
  // Allow the user to reply to posts.
  REPLY_TO_POSTS = 25;
  // Allow the user to edit post titles and/or links.
  EDIT_POST_TITLES_AND_LINKS = 26;

  // As a user permission, allow the user to view posts with `SERVER_PUBLIC` or higher visibility. 
  // As a group permission, allow the user to view [`GroupPost`](#rellm-GroupPost)s whose [`Event`](#rellm-Event) [`Post`](#rellm-Post)s have `LIMITED` or higher visibility.
  // Allow anonymous users to view events with `GLOBAL_PUBLIC` visibility (when configured as an anonymous user permission).
  VIEW_EVENTS = 30;
  // As a user permission, allow the user to create [`Event`](#rellm-Event)s of `PRIVATE` and `LIMITED` visibility.
  // As a group permission, allow the user to create [`GroupPost`](#rellm-GroupPost)s for `EVENT` and `FEDERATED_OCCASION` [`PostContext`](#rellm-PostContext)s..
  CREATE_EVENTS = 31;
  // Allow the user to publish events with `SERVER_PUBLIC` visibility.
  PUBLISH_EVENTS_LOCALLY = 32;
  // Allow the user to publish events with `GLOBAL_PUBLIC` visibility.
  PUBLISH_EVENTS_GLOBALLY = 33;
  // Allow the user to moderate events.
  MODERATE_EVENTS = 34;
  // Allow the user to RSVP to events that allow RSVPs.
  RSVP_TO_EVENTS = 35;
  reserved 36;
  reserved "SYNCHRONIZE_EVENTS"; // Replaced by `SYNC_EVENTS_FROM_ICS` below.

  // Allow the user to view media with `SERVER_PUBLIC` or higher visibility. *Not currently enforced.*
  // Allow anonymous users to view media with `GLOBAL_PUBLIC` visibility (when configured as an anonymous user permission). *Not currently enforced.*
  VIEW_MEDIA = 40;
  // Allow the user to create media of `PRIVATE` and `LIMITED` visibility. *Not currently enforced.*
  CREATE_MEDIA = 41;
  // Allow the user to publish media with `SERVER_PUBLIC` visibility. *Not currently enforced.*
  PUBLISH_MEDIA_LOCALLY = 42;
  // Allow the user to publish media with `GLOBAL_PUBLIC` visibility. *Not currently enforced.*
  PUBLISH_MEDIA_GLOBALLY = 43;
  // Allow the user to moderate events.
  MODERATE_MEDIA = 44;

  READ_PERSONAL_MESSAGES = 50;
  READ_ALL_SYSTEM_MESSAGES = 51;

  // Allow the user to create/update their own [`AIProvider`](#rellm-AIProvider)s (see
  // `ai_providers.proto`) and grant/revoke other users' access to them.
  CREATE_AI_PROVIDERS = 60;

  // Allow the user to create/update [`SyncSource`](#rellm-SyncSource)s (iCal subscriptions) that
  // synchronize [`Event`](#rellm-Event)s in.
  SYNC_EVENTS_FROM_ICS = 700;
  // Allow the user to create/update [`SyncSource`](#rellm-SyncSource)s (RSS subscriptions) that
  // synchronize [`Post`](#rellm-Post)s in.
  SYNC_POSTS_FROM_RSS = 701;
  // Allow the user to create/update [`SyncSource`](#rellm-SyncSource)s (Atom subscriptions) that
  // synchronize [`Post`](#rellm-Post)s in.
  SYNC_POSTS_FROM_ATOM = 702;

  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Occasions to a
  // connected Facebook Page, and to sync Occasions to them.
  SYNC_EVENTS_TO_FACEBOOK = 1000;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Posts to a
  // connected Facebook Page, and to sync Posts to them.
  SYNC_POSTS_TO_FACEBOOK = 1001;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Occasions to a
  // connected Instagram Business/Creator account, and to sync Occasions to them.
  SYNC_EVENTS_TO_INSTAGRAM = 1010;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Posts to a
  // connected Instagram Business/Creator account, and to sync Posts to them.
  SYNC_POSTS_TO_INSTAGRAM = 1011;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Occasions to a
  // connected Mastodon account, and to sync Occasions to them.
  SYNC_EVENTS_TO_MASTODON = 1020;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Posts to a
  // connected Mastodon account, and to sync Posts to them.
  SYNC_POSTS_TO_MASTODON = 1021;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Occasions to a
  // connected Bluesky account, and to sync Occasions to them.
  SYNC_EVENTS_TO_BLUESKY = 1030;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Posts to a
  // connected Bluesky account, and to sync Posts to them.
  SYNC_POSTS_TO_BLUESKY = 1031;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Occasions to a
  // connected X (Twitter) account, and to sync Occasions to them.
  SYNC_EVENTS_TO_X_TWITTER = 1040;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Posts to a
  // connected X (Twitter) account, and to sync Posts to them.
  SYNC_POSTS_TO_X_TWITTER = 1041;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Occasions to a
  // connected Threads account, and to sync Occasions to them.
  SYNC_EVENTS_TO_THREADS = 1050;
  // Allow the user to create/update [`SyncDestination`](#rellm-SyncDestination)s that cross-post Posts to a
  // connected Threads account, and to sync Posts to them.
  SYNC_POSTS_TO_THREADS = 1051;

  // Indicates the user is a business. Used purely for display purposes.
  BUSINESS = 9998;

  // Allow the user to run bots. There is no enforcement of this permission (yet),
  // but it lets other users know that the user is allowed to run bots.
  RUN_BOTS = 9999;

  // Marks the user as an admin. In the context of user permissions, allows the user to configure the server,
  // moderate/update visibility/permissions to any [`User`](#rellm-User), [`Group`](#rellm-Group), [`Post`](#rellm-Post) or [`Event`](#rellm-Event). In the context of group permissions, allows the user to configure the group,
  // modify members and member permissions, and moderate [`GroupPost`](#rellm-GroupPost)s and `GroupEvent`s.
  ADMIN = 10000;

  // Allow the user to view the private contact methods of other users.
  // Kept separate from `ADMIN` to allow for more fine-grained privacy control.
  VIEW_PRIVATE_CONTACT_METHODS = 10001;

  // Allow the user to edit [`ServerConfiguration.cluster_resources`](#rellm-ClusterResources) via
  // [`ConfigureServer`](#grpc-api-ConfigureServer). `cluster_resources` is otherwise visible
  // (read-only) to any `ADMIN` - this permission gates *editing* it specifically, on top of
  // `ADMIN`, since misconfiguring it (wrong `conductor_host`/`cluster_shared_secret`) affects
  // cluster-mates this admin may not operate. Kept separate from `ADMIN` the same way
  // `VIEW_PRIVATE_CONTACT_METHODS` is, and deliberately *not* grantable via
  // [`UpdateUser`](#grpc-api-UpdateUser) like other permissions - only settable directly in the
  // database (e.g. via the `set_permission` binary), so granting it is always a deliberate
  // operator action, never a side effect of a normal admin-managing-admins flow.
  EDIT_CLUSTER_SETTINGS = 10002;

  // Allow the user to edit [`MediaSettings.server_media_allocation_bytes`](#rellm-MediaSettings)
  // via [`ConfigureServer`](#grpc-api-ConfigureServer). Raising this cap changes how much total
  // Media storage the server will accept across every user, so - same reasoning as
  // `EDIT_CLUSTER_SETTINGS` above - it's kept separate from `ADMIN` and deliberately *not*
  // grantable via [`UpdateUser`](#grpc-api-UpdateUser), only settable directly in the database
  // (e.g. via the `set_permission` binary).
  EDIT_SERVER_MEDIA_ALLOCATION = 10003;
}
