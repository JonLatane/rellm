syntax = "proto3";

package rellm;

import "google/protobuf/timestamp.proto";

import "permissions.proto";
import "visibility_moderation.proto";

// A Rellm `Media` message represents a single media item, such as a photo or video.
// Media data is deliberately *not accessible from the gRPC API*. Instead, the client
// should fetch media from `http[s]://my.rellm.instance/media/{id}`, unless `url` is set,
// in which case that URL should be used instead (used for media Rellm doesn't store
// locally, e.g. from federated ActivityPub/Mastodon or AT Protocol/Bluesky content).
//
// Media items may be created with a HTTP POST to `http[s]://my.rellm.instance/media`
// along with an "Authorization" header (your access token) and a "Content-Type" header.
// On success, the endpoint will return the media ID in plaintext.
//
// `POST /media` supports the following headers:
// - `Content-Type` - The MIME content type of the media item.
// - `Filename` - An optional title for the media item.
// - `Authorization` - Rellm Access Token for the user. Required, but may be supplied in `Cookies`.
// - `Cookies` - Standard web cookies. The `rellm_access_token` cookie may be used for authentication.
//
// `GET /media/{id}` supports the following:
// - **Headers**:
//     - `Authorization` - Rellm Access Token for the user. May also be supplied in `Cookies` or via query parameter.
//     - `Cookies` - Standard web cookies. The `rellm_access_token` cookie may be used for authentication.
// - **Query Parameters**:
//     - `authorization` - Rellm Access Token for the user. May also be supplied in the `Cookies` or `Authorization` headers.
// - Fetching media without authentication requires that it has `GLOBAL_PUBLIC` visibility (or `LICENSED`,
//   if `MediaSettings.licensed_media_visible_globally` is set). Visibility is otherwise enforced
//   like `GetMedia`'s: `SERVER_PUBLIC` for any logged-in user, `LIMITED` for followers of the owner,
//   `PRIVATE` for the owner and admins only. A media item the viewer can't see responds `404`.
// - Anonymous (unauthenticated) responses omit CORS `Access-Control-Allow-*` headers when the server's
//   `MediaSettings.block_cors_anonymous_media_access` is set, so third-party sites can embed (`<img>`,
//   `<video>`) but not script-read public media.
// - `LICENSED` media's full-quality bytes are only served to its owner, admins, and users holding an active
//   [`License`](#rellm-License) for it. Everyone else is served its `UNLICENSED_PREVIEW_MEDIUM` conversion
//   (audio/video only; see `MediaMetadata.unlicensed_preview_start_ms`), or `403 Forbidden` if none exists yet.
message Media {
  // The ID of the media item.
  string id = 1;
  // The user who created the media item.
  optional Author author = 2;
  // An optional title for the media item.
  optional string name = 4;
  // An optional description for the media item.
  optional string description = 5;
  // Visibility of the media item.
  Visibility visibility = 6;
  // Moderation of the media item.
  Moderation moderation = 7;
  // Indicates the media was generated by the server rather than uploaded manually by a user.
  bool generated = 8;
  // Media is generally stored as-is on upload.
  // When background jobs process and compress the media, this flag is set to true.
  bool processed = 9;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  MediaMetadata metadata = 17;
  // An external URL to fetch the media from, in lieu of `/media/{id}`. Used for representing
  // media owned by other protocols/servers (e.g. ActivityPub/Mastodon, AT Protocol/Bluesky)
  // that Rellm does not store locally. If unset, clients fall back to `/media/{id}`.
  optional string url = 18;

  // Every stored copy of this media item's bytes -- the original upload
  // (`MEDIA_CONVERSION_ORIGINAL`) plus any auto-generated resized copies (see
  // `convert_media_sizes`'s background job) -- each with its own content type, byte size, and
  // (once known) aspect ratio. Always has at least one `MEDIA_CONVERSION_ORIGINAL` entry unless
  // `url` is set (externally-hosted media has no locally-stored copies at all). The original is
  // tracked here rather than as a separate top-level field so it can eventually be deleted to
  // free space once converted copies exist, while remaining fully accounted for by
  // `User.media_storage_bytes_used` up until that point.
  repeated MediaSize sizes = 19;
}

// One stored copy of a `Media` item's bytes -- either its untouched original upload
// (`MEDIA_CONVERSION_ORIGINAL`) or an auto-generated resized copy, as produced by the
// `convert_media_sizes` background job. Fields are tracked per-size (rather than once on `Media`
// itself) so that a future conversion producing a different kind of derived copy -- e.g. a
// `image/jpeg` poster frame for a `video/mp4` original, or a differently-cropped aspect ratio --
// can vary any of them independently of the original.
message MediaSize {
  // Which copy this is -- the untouched original, or one of the auto-generated resized copies.
  MediaConversion conversion = 1;
  // This copy's size on disk/in object storage, in bytes. Summed (across every size, of every
  // Media a user owns) into `User.media_storage_bytes_used`.
  uint64 size_bytes = 2;
  // Width divided by height. Set by the `convert_media_sizes` background job once it's able to
  // read the media's dimensions (via ImageMagick/ffprobe); unset until then.
  optional float aspect_ratio = 3;
  // The MIME content type of this copy specifically. Usually identical across every size of a
  // given `Media`, but not guaranteed to be -- e.g. a future video-thumbnail conversion could
  // produce an `image/jpeg` size for a `video/mp4` original.
  string content_type = 4;
}

// Which stored copy of a `Media` item's bytes a `MediaSize` represents.
enum MediaConversion {
  // The untouched original upload.
  MEDIA_CONVERSION_ORIGINAL = 0;
  // Resized to fit within 320x320 px, preserving aspect ratio (never upscaled).
  MEDIA_CONVERSION_SMALL = 1;
  // Resized to fit within 800x800 px, preserving aspect ratio (never upscaled).
  MEDIA_CONVERSION_MEDIUM = 2;
  // Resized to fit within 1600x1600 px, preserving aspect ratio (never upscaled).
  MEDIA_CONVERSION_LARGE = 3;

  // For video media only: a `image/jpeg` poster frame captured (via `ffmpeg`) at
  // `MediaMetadata.video_preview_time_ms`, resized to fit within 320x320 px, preserving aspect
  // ratio (never upscaled) -- same dimension tier as `MEDIA_CONVERSION_SMALL`, just a still frame
  // of the video rather than a resized copy of it. Regenerated by the same `convert_media_sizes`
  // background job; deleted (and marked for regeneration) whenever `UpdateMedia` changes
  // `video_preview_time_ms`, since the existing frame no longer matches the requested time.
  VIDEO_PREVIEW_THUMBNAIL_SMALL = 5;
  // Same as `VIDEO_PREVIEW_THUMBNAIL_SMALL`, but resized to fit within 800x800 px -- the
  // `MEDIA_CONVERSION_MEDIUM` tier.
  VIDEO_PREVIEW_THUMBNAIL_MEDIUM = 6;
  // Same as `VIDEO_PREVIEW_THUMBNAIL_SMALL`, but resized to fit within 1600x1600 px -- the
  // `MEDIA_CONVERSION_LARGE` tier.
  VIDEO_PREVIEW_THUMBNAIL_LARGE = 7;

  // For audio media only: an `image/png` waveform image of the whole file (rendered via
  // `ffmpeg`'s `showwavespic` filter, transparent background), 320x320 px (square, so clients can
  // squash it vertically to suit their layout) --
  // same width tier as `MEDIA_CONVERSION_SMALL`. Audio has no pixel dimensions of its own, so unlike
  // the video/image sizes these are *not* "fit within NxN": they're always exactly the tier's size.
  // Regenerated by the same `convert_media_sizes` background job.
  AUDIO_PREVIEW_THUMBNAIL_SMALL = 10;
  // Same as `AUDIO_PREVIEW_THUMBNAIL_SMALL`, but 800x800 px -- the `MEDIA_CONVERSION_MEDIUM` tier.
  AUDIO_PREVIEW_THUMBNAIL_MEDIUM = 11;
  // Same as `AUDIO_PREVIEW_THUMBNAIL_SMALL`, but 1600x1600 px -- the `MEDIA_CONVERSION_LARGE` tier.
  AUDIO_PREVIEW_THUMBNAIL_LARGE = 12;

  // For audio and video media only: a medium-quality crop of the original from
  // `MediaMetadata.unlicensed_preview_start_ms` to `unlicensed_preview_end_ms` (via `ffmpeg`), in the
  // original's own container-family content type (video: `video/mp4`, audio: `audio/mpeg`). This is
  // what viewers *without* a [`License`](#rellm-License) are served for `LICENSED` media. Regenerated
  // by the `convert_media_sizes` background job; deleted (and marked for regeneration) whenever
  // `UpdateMedia` changes either bound. May also be deleted manually via `DeleteMediaSizes`.
  //
  // (Numbered 13 rather than 11 because `AUDIO_PREVIEW_THUMBNAIL_MEDIUM` already holds 11.)
  UNLICENSED_PREVIEW_MEDIUM = 13;
}

// Free-form metadata about a [`Media`](#rellm-Media) item that isn't queried/filtered on, so doesn't need its
// own columns.
message MediaMetadata {
  // For video media, how far into the video (in milliseconds) its preview/poster frame should be
  // taken from -- both via a `#t=<seconds>` Media Fragments URI on the `<video>` element's `src`,
  // and as the timestamp `ffmpeg` seeks to when generating the `VIDEO_PREVIEW_THUMBNAIL_*` poster
  // frames (see `MediaConversion`). Unset defaults to 1s (1000 in ms), or if the video is shorter
  // than 1.5s, the midpoint of the video. Settable via `UpdateMedia`; changing it invalidates
  // (deletes) any existing `VIDEO_PREVIEW_THUMBNAIL_*` sizes, so the `convert_media_sizes`
  // background job regenerates them at the new time.
  optional uint64 video_preview_time_ms = 1;

  // Credits. All free-form text; unset/blank means "none". Editable via `UpdateMedia` (setting one
  // to an empty string clears it). Searched by `GetMediaRequest.search_text`, most to least
  // important: name/artist/director, then album/composer/starring/cast/narrator, then
  // producer/crew/publisher, then description.
  optional string artist = 2;
  optional string album = 3;
  optional string composer = 4;
  optional string director = 5;
  optional string producer = 6;
  optional string starring = 7;
  optional string cast = 8;
  optional string crew = 9;
  optional string narrator = 10;
  optional string publisher = 11;

  // For audio and video media only: the range of the original (in milliseconds) that is cropped into
  // the `UNLICENSED_PREVIEW_MEDIUM` conversion served to viewers without a license for `LICENSED`
  // media. Unset start defaults to 0; unset end defaults to start + 30s (clamped to the media's
  // duration). Changing either invalidates (deletes) any existing `UNLICENSED_PREVIEW_MEDIUM` size so the
  // `convert_media_sizes` background job regenerates it.
  optional uint64 unlicensed_preview_start_ms = 12;
  optional uint64 unlicensed_preview_end_ms = 13;
}

// Grants `licensed_to` access to a `LICENSED` [`Media`](#rellm-Media) item's full-quality bytes.
// Stored in the `media_licenses` table. A license is *active* while `revoked_at` is unset.
// (Purchasing licenses through Rellm's Market is not implemented yet.)
message License {
  string id = 1;
  // The user holding the license to the media.
  Author licensed_to = 2;
  // The licensed media.
  MediaReference media = 3;
  google.protobuf.Timestamp created_at = 4;
  // When set, the license no longer grants access.
  optional google.protobuf.Timestamp revoked_at = 5;
}

// A reference to a media item, designed to be included in other messages as a reference.
// Contains the bare minimum data needed to fetch media via the HTTP API and render it,
// and the media item's name (for alt text usage).
message MediaReference {
  // The ID of the media item.
  string id = 2;
  // An optional title for the media item.
  optional string name = 3;
  // Indicates the media was generated by the server rather than uploaded manually by a user.
  bool generated = 4;
  MediaMetadata metadata = 5;
  // See `Media.sizes`.
  repeated MediaSize sizes = 6;
  // An external URL to fetch the media from, in lieu of `/media/{id}`. See `Media.url`.
  // If unset, clients fall back to `/media/{id}`.
  optional string url = 11;
  optional string description = 12;
  // The user who created the media item. See `Media.author`. Included here (unlike most other
  // `MediaReference` fields, which are deliberately pared down from `Media`) so clients that only
  // ever see a `MediaReference` -- e.g. a `Post.media` item -- can still tell whether the current
  // viewer owns it, without a separate `Media` lookup.
  optional Author author = 13;
  // See `Media.visibility`. Included so a client holding only a `MediaReference` (e.g. the media
  // viewer) can show/edit it and tell whether it's `LICENSED`.
  Visibility visibility = 14;
}

// Post/authorship-centric version of User. UI can cross-reference user details from its own
// cache (for things like admin/bot icons).
//
// Lives in `media.proto` (rather than `users.proto`, where it used to live, or its own
// `authors.proto`, split out from `users.proto` for a time) because `Author.avatar` needs
// `MediaReference` and `Media`/`MediaReference` need `Author` (see this field's own doc) --
// mutually recursive types belong in the same file, since `protoc` rejects circular *file*
// imports even though the recursive *types* themselves are perfectly valid. `users.proto`
// (`User.sync_destinations`) and `sync.proto` (`SyncDestination.owner`, `SyncSource.owner`) both
// depend on this without depending on each other, via their own `import "media.proto"` (both
// already needed it anyway, for `User.avatar`/`Media`-shaped fields).
message Author {
  // Permanent string ID for the user. Will never contain a `@` symbol.
  string user_id = 1;
  // Impermanent string username for the user. Will never contain a `@` symbol.
  optional string username = 2;
  // The user's avatar.
  optional MediaReference avatar = 3;
  optional string real_name = 4;
  repeated Permission permissions = 5;
}

// Valid GetMediaRequest formats:
// - `{user_id: abc123}` - Gets the media of the given user that the current user can see. IE:
//     - *all* of the current user's own media
//     - `GLOBAL_PUBLIC` media (and `LICENSED`, if `MediaSettings.licensed_media_visible_globally`) for the user if the current user is not logged in.
//     - `LICENSED` media too for any logged-in user.
//     - `SERVER_PUBLIC` media for the user if the current user is logged in.
//     - `LIMITED` media for the user if the current user is following the user.
// - `{media_id: abc123}` - Gets the media with the given ID, if visible to the current user.
// - `{}` (neither `media_id` nor `user_id`) - Browses *all* media on the server visible to the current user
//   (never other users' `PRIVATE`/`LIMITED` media), newest first -- the basis of the Media/Video/Audio pages.
//   Combine with `content_type` and/or `search_text`.
//
// `content_type` and `search_text` also narrow `{user_id: ...}` requests.
message GetMediaRequest {
  // Returns the single media item with the given ID.
  optional string media_id = 1;
  // Returns all media items for the given user.
  optional string user_id = 2;
  // Filters by the original upload's MIME content type. Either exact (`video/mp4`) or a
  // wildcard subtype (`audio/*`, `video/*`, `image/*`). Backed by an indexed column.
  optional string content_type = 3;
  // Full-text search over name, credits (artist, album, composer, ...) and description -- see
  // `MediaMetadata`'s doc for field weighting. Prefix-matches, like `GetPosts`' `TEXT_SEARCH`.
  // Results are ranked by match quality, then recency.
  optional string search_text = 4;

  uint32 page = 11;
}

message GetMediaResponse {
  repeated Media media = 1;
  bool has_next_page = 2;
}
